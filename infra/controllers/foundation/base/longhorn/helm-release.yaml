---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    # From: curl https://raw.githubusercontent.com/longhorn/longhorn/v1.11.2/deploy/longhorn-images.txt
    image-lock/extra-images: >-
      longhornio/backing-image-manager:v1.11.2,
      longhornio/longhorn-engine:v1.11.2,
      longhornio/longhorn-instance-manager:v1.11.2,
      longhornio/longhorn-manager:v1.11.2,
      longhornio/longhorn-share-manager:v1.11.2,
      longhornio/longhorn-ui:v1.11.2,
      longhornio/longhorn-cli:v1.11.2,
      longhornio/csi-attacher:v4.11.0-20260428,
      longhornio/csi-provisioner:v5.3.0-20260428,
      longhornio/csi-resizer:v2.1.0-20260428,
      longhornio/csi-snapshotter:v8.5.0-20260428,
      longhornio/csi-node-driver-registrar:v2.16.0-20260428,
      longhornio/livenessprobe:v2.18.0-20260428,
      longhornio/support-bundle-kit:v0.0.84
spec:
  releaseName: longhorn
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: helm-chart-longhorn
    namespace: longhorn-system
  values:
    defaultSettings:
      v1DataEngine: "true"
      upgradeChecker: "false"
      defaultDataPath: "/var/lib/longhorn"
      # The default SSD path is a dedicated XFS filesystem.
      storageReservedPercentageForDefaultDisk: "10"
      allowEmptyDiskSelectorVolume: "false"
    persistence:
      createStorageClass: true
      dataEngine: "v1"
      defaultClass: false
      defaultReplicaCount: 3
      defaultDataLocality: "best-effort"
      defaultFsType: "ext4"

    openshift:
      enabled: false
    longhornManager:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 1Gi
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: DaemonSet
          name: longhorn-manager
        patch: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: longhorn-manager
          spec:
            template:
              spec:
                containers:
                # The post-upgrade hook reads the manager image from containers[0].
                - name: longhorn-manager
                - name: pre-pull-share-manager-image
                  resources:
                    requests:
                      cpu: 10m
                      memory: 16Mi
                    limits:
                      cpu: 100m
                      memory: 64Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: longhorn-driver-deployer
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: longhorn-driver-deployer
          spec:
            template:
              spec:
                containers:
                - name: longhorn-driver-deployer
                  resources:
                    requests:
                      cpu: 20m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
                initContainers:
                - name: wait-longhorn-manager
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 100m
                      memory: 128Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: longhorn-ui
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: longhorn-ui
          spec:
            template:
              spec:
                containers:
                - name: longhorn-ui
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 200m
                      memory: 128Mi
