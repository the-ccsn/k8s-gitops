---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  interval: 30m
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      version: "1.*"
      interval: 12h
  values:
    existingSecretAdminPassword: harbor-admin-auth
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

    expose:
      type: route
      route:
        hosts:
        - harbor.ccsn.dev
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-gateway
          namespace: prod
      tls:
        enabled: false
    externalURL: https://harbor.ccsn.dev

    # Route Harbor's outbound requests through the cluster egress proxy.
    proxy:
      httpProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      httpsProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      # Resolve and reach internal CCSN endpoints without the public egress proxy.
      noProxy: 127.0.0.1,localhost,.svc,.cluster.local,.ccsn.dev,harbor.harbor.svc,core,jobservice,registry,portal

    database:
      type: external
      external:
        host: harbor-pg-cluster-rw
        port: 5432
        username: app
        existingSecret: harbor-pg-cluster-app
        coreDatabase: registry
    redis:
      type: external
      external:
        addr: harbor-dragonfly:6379
        username: default
        # Use an existing secret to connect to Dragonfly. The key must be REDIS_PASSWORD.
        existingSecret: harbor-redis-auth

    # Disable scanners to reduce footprint; can be enabled later.
    trivy:
      enabled: false

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

    trace:
      enabled: true
      provider: otel
      # Harbor's sampler is not parent-based; retain all ingress-selected traces.
      sample_rate: 1
      namespace: harbor
      attributes:
        k8s.namespace.name: harbor
      otel:
        endpoint: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
        url_path: /v1/traces
        # HTTP inside ambient; ztunnel provides transport mTLS.
        insecure: true

    exporter:
      podLabels:
        istio.io/dataplane-mode: ambient
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # Shared filesystem volumes allow Registry and Jobservice to overlap on updates.
    updateStrategy:
      type: RollingUpdate

    core:
      podLabels:
        istio.io/dataplane-mode: ambient
      extraEnvVars:
      - name: PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE
        value: ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr
      - name: REPLICATION_ADAPTER_WHITELIST
        value: ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr

      - name: OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: harbor-oidc
            key: clientId
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: harbor-oidc
            key: clientSecret
      - name: CONFIG_OVERWRITE_JSON
        value: '{"self_registration":false,"project_creation_restriction":"adminonly","auth_mode":"oidc_auth","primary_auth_mode":true,"oidc_name":"Student Network Center Accounts","oidc_endpoint":"https://login.ccsn.dev/oidc","oidc_scope":"openid,profile,email,roles,offline_access","oidc_extra_redirect_parms":{"prompt":"consent"},"oidc_client_id":"$(OIDC_CLIENT_ID)","oidc_client_secret":"$(OIDC_CLIENT_SECRET)","oidc_verify_cert":true,"oidc_auto_onboard":true,"oidc_user_claim":"username","oidc_groups_claim":"roles","oidc_group_filter":"^harbor:[a-z]+$","oidc_admin_group":"","oidc_logout":true}'
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '1'
          memory: 512Mi
    registry:
      podLabels:
        istio.io/dataplane-mode: ambient
      # Also rolls registryctl: the chart does not checksum its trace ConfigMap.
      podAnnotations:
        resource.opentelemetry.io/service.namespace: harbor
      # Require two successful readiness probes before accepting traffic.
      registry:
        readinessProbe:
          successThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
      controller:
        readinessProbe:
          successThreshold: 2
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    jobservice:
      podLabels:
        istio.io/dataplane-mode: ambient
      # Require two successful readiness probes before accepting traffic.
      readinessProbe:
        successThreshold: 2
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: '1'
          memory: 256Mi

    persistence:
      enabled: true
      resourcePolicy: keep
      storageClass: longhorn
      persistentVolumeClaim:
        registry:
          storageClass: longhorn-hdd
          size: 100Gi
          accessMode: ReadWriteMany
        jobservice:
          jobLog:
            storageClass: longhorn-hdd
            size: 5Gi
            accessMode: ReadWriteMany
        database:
          size: 10Gi
        redis:
          size: 5Gi
    portal:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
