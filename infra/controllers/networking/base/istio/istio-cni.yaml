# https://fluxcd.io/flux/components/helm/helmreleases/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  dependsOn:
    - name: istio-base
    - name: istiod
  releaseName: istio-cni
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: helm-chart-cni
    namespace: istio-system
  values:
    profile: ambient
    ambient:
      # Do not silently skip mesh enrollment when Kubernetes is unavailable during recovery.
      enableAmbientDetectionRetry: true
    # The chart's ConfigMap update alone does not restart CNI pods.
    podAnnotations:
      ccsn.dev/ambient-detection-retry: "true"
    # https://istio.io/latest/docs/ambient/install/platform-prerequisites/#k3s
    global:
      hub: docker.io/istio
      tag: "1.31.1"
      variant: distroless
      platform: k3s
      # In order to use native nftable rules instead of iptable rules, set this flag to true.
      nativeNftables: false
