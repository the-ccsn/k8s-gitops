apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-admin
spec:
  parentRefs:
    - name: default-gateway
      sectionName: https
    - name: default-gateway
      sectionName: http
  hostnames:
    - swfs-admin.ccsn.dev
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
              - X-OAuth2-Gateway-Access-Token
              - X-OAuth2-Gateway-Id-Token
      backendRefs:
        - name: seaweedfs-admin
          port: 4180
