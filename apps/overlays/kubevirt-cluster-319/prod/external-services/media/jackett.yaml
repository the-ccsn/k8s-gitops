apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-jackett
spec:
  exportTo: ["."]
  hosts:
    - jackett.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 9117
      name: http-jackett
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-jackett
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - jackett.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: jackett.external-services.mesh.internal
          port: 9117
