apiVersion: batch/v1
kind: Job
metadata:
  name: cloudreve-bootstrap-v4
  namespace: prod
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      volumes:
      - name: credentials
        secret:
          secretName: cloudreve-bootstrap
          defaultMode: 256
      - name: bootstrap
        configMap:
          name: cloudreve-bootstrap-config
      - name: sql
        emptyDir: {}
      initContainers:
      - name: prepare
        image: docker.ccsn.dev/library/python:3.13-alpine
        command:
        - python3
        - /bootstrap/bootstrap-sql.py
        volumeMounts:
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: sql
          mountPath: /sql
      containers:
      - name: configure
        image: docker.ccsn.dev/library/postgres:16-alpine
        command:
        - sh
        - -ec
        - for attempt in $(seq 1 150); do if psql -X -tAc "SELECT count(*) FROM storage_policies
          WHERE id=1" 2>/dev/null | grep -q '^1$'; then psql -X -v ON_ERROR_STOP=1
          -q -f /sql/bootstrap.sql; echo 'Cloudreve storage and recovery account configured';
          exit 0; fi; sleep 5; done; echo 'Cloudreve schema not ready' >&2; exit 1
        env:
        - name: PGHOST
          value: cloudreve-pg-cluster-rw
        - name: PGDATABASE
          value: cloudreve
        - name: PGUSER
          value: cloudreve
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudreve-pg-cluster-app
              key: password
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
