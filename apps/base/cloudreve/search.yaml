apiVersion: v1
kind: Service
metadata:
  name: cloudreve-meilisearch
  namespace: prod
spec:
  selector:
    app.kubernetes.io/name: cloudreve-meilisearch
  ports:
  - name: http
    port: 7700
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudreve-meilisearch
  namespace: prod
spec:
  serviceName: cloudreve-meilisearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudreve-meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudreve-meilisearch
        app.kubernetes.io/component: cloudreve-search
    spec:
      automountServiceAccountToken: false
      containers:
      - name: meilisearch
        image: docker.ccsn.dev/getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        ports:
        - name: http
          containerPort: 7700
        env:
        - name: MEILI_ENV
          value: production
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_MAX_INDEXING_MEMORY
          value: 1GiB
        - name: MEILI_MAX_INDEXING_THREADS
          value: '2'
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: cloudreve-search
              key: apiKey
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health
            port: http
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /meili_data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn-backup
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve-tika
  namespace: prod
spec:
  selector:
    app.kubernetes.io/name: cloudreve-tika
  ports:
  - name: http
    port: 9998
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudreve-tika
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudreve-tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudreve-tika
        app.kubernetes.io/component: cloudreve-search
    spec:
      automountServiceAccountToken: false
      containers:
      - name: tika
        image: docker.ccsn.dev/apache/tika:4.1.0-1@sha256:06bcdbd09aca073293e5a171ad161418cc93c91d58d9e4e205064eade84889d4
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xms256m -Xmx1024m
        ports:
        - name: http
          containerPort: 9998
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /version
            port: http
        livenessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudreve-search
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cloudreve-search
  policyTypes: [Ingress]
  ingress:
  - ports:
    - protocol: TCP
      port: 15008
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudreve
  namespace: prod
automountServiceAccountToken: false
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cloudreve-search
  namespace: prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: cloudreve-search
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/prod/sa/cloudreve
