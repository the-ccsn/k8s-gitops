apiVersion: role.logto.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: harbor-maintainer
  namespace: harbor
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  forProvider:
    name: harbor:maintainer
    description: Image operations in GitOps-managed Harbor projects
    type: User
    isDefault: false
    scopeIds: []
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
