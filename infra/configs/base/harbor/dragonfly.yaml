---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: harbor-dragonfly
  namespace: harbor
spec:
  serviceAccountName: harbor-dragonfly
  # Harbor is not namespace-enrolled; protect this instance's admin port in ambient.
  podMetadata:
    labels:
      istio.io/dataplane-mode: ambient
  image: ghcr.io/the-ccsn/dragonfly:v1.40.1-auto-b204b3d41b2c@sha256:73ffbda489e1b16cf2378cad179bc612c1e99a22030d6b0eef0bd604fba9f862
  replicas: 1
  args:
    - --maxmemory=1600mb
    - --cache_mode=true
    # io_uring's idle network waits pollute node/cgroup I/O pressure accounting.
    - --force_epoll=true
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 10Mi
  authentication:
    passwordFromSecret:
      name: harbor-redis-auth
      key: REDIS_PASSWORD

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-dragonfly
  namespace: harbor
automountServiceAccountToken: false
---
# Admit same-namespace Redis clients, metrics, and native Operator administration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-dragonfly-metrics
  namespace: harbor
spec:
  podSelector:
    matchLabels:
      app: harbor-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
          app.kubernetes.io/instance: victoriametrics-vmks
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dragonfly-operator-system
      podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 15008
---
# Preserve native Operator/peer administration while excluding unrelated workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: harbor-dragonfly-admin
  namespace: harbor
spec:
  selector:
    matchLabels:
      app: harbor-dragonfly
      app.kubernetes.io/name: dragonfly
  action: DENY
  rules:
  - from:
    - source:
        notPrincipals:
        - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
        - cluster.local/ns/dragonfly-operator-system/sa/dragonfly-operator-controller-manager
        - cluster.local/ns/harbor/sa/harbor-dragonfly
    to:
    - operation:
        ports:
        - '9999'
