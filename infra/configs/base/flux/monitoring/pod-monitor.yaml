apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: monitoring
  labels:
    application: flux
    component: controllers
spec:
  sampleLimit: 10000
  namespaceSelector:
    matchNames: [flux-system]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [source-controller, kustomize-controller, helm-controller, notification-controller]
  podMetricsEndpoints:
    - port: http-prom
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: flux_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
