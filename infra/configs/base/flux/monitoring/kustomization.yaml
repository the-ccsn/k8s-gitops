apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pod-monitor.yaml
  - ./operator-pod-monitor.yaml
  - ./metrics-network-policy.yaml
  - ./metrics-authorization.yaml
  - ./rules.yaml
  - ./dashboard.yaml

configMapGenerator:
  - name: flux-dashboards
    namespace: grafana
    files:
      - dashboard.json
      - control-plane-dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard content updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
