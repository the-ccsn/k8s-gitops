apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-container-cpu
  namespace: monitoring
spec:
  groups:
    - name: kubernetes-container-cpu
      interval: 30s
      rules:
        # Standard kube-prometheus recording rule consumed by upstream dashboards.
        - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
          expr: |
            sum by (k8s_cluster_name, node, namespace, pod, container) (
              irate(container_cpu_usage_seconds_total{
                job="kubelet", metrics_path="/metrics/cadvisor", image!="",
                container!="", container!="POD", pod!=""
              }[5m])
            )
