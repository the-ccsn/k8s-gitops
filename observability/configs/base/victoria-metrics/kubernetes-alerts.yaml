apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-monitoring
  namespace: monitoring
  labels:
    app: monitoring
spec:
  groups:
    - name: application-monitoring
      rules:
        - alert: PodFrequentlyRestarting
          # Ignore historical counter values when a kube-state-metrics target appears.
          expr: |
            sum by (k8s_cluster_name, namespace, pod) (increase_prometheus(kube_pod_container_status_restarts_total[1h])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is frequently restarting"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last hour"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: PodNotReady
          expr: |
            (kube_pod_status_ready{condition="true"} == 0)
            unless on (k8s_cluster_name, namespace, pod)
            (kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready for more than 5 minutes"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: HighMemoryUsage
          expr: |
            (
              max by (k8s_cluster_name, namespace, pod, container) (
                container_memory_working_set_bytes{container!="", container!="POD", pod!=""}
              )
              / max by (k8s_cluster_name, namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0
              )
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory usage > 90%"
            description: "Container memory usage is {{ $value | humanizePercentage }}"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: HighCpuUsage
          expr: |
            (
              sum by (k8s_cluster_name, namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{container!="", container!="POD", pod!=""}[5m])
              )
              / max by (k8s_cluster_name, namespace, pod, container) (
                kube_pod_container_resource_limits{resource="cpu", unit="core"} > 0
              )
            ) > 0.9
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU usage > 90%"
            description: "CPU usage is {{ $value | humanizePercentage }}"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: ContainerMemoryLimitMissing
          expr: |
            (
              max by (k8s_cluster_name, namespace, pod, container) (
                kube_pod_container_info or kube_pod_init_container_info
              )
              unless on (k8s_cluster_name, namespace, pod, container)
              (
                (kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0)
                or (kube_pod_init_container_resource_limits{resource="memory", unit="byte"} > 0)
              )
            )
            and on (k8s_cluster_name, namespace, pod)
            (kube_pod_status_phase{phase!~"Succeeded|Failed"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no memory limit"
            description: "An application or init container in an active Pod has no positive memory limit"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/runbooks/container-limits.md
        - alert: ContainerCpuLimitMissing
          expr: |
            (
              max by (k8s_cluster_name, namespace, pod, container) (
                kube_pod_container_info or kube_pod_init_container_info
              )
              unless on (k8s_cluster_name, namespace, pod, container)
              (
                (kube_pod_container_resource_limits{resource="cpu", unit="core"} > 0)
                or (kube_pod_init_container_resource_limits{resource="cpu", unit="core"} > 0)
              )
            )
            and on (k8s_cluster_name, namespace, pod)
            (kube_pod_status_phase{phase!~"Succeeded|Failed"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no CPU limit"
            description: "An application or init container in an active Pod has no positive CPU limit"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/runbooks/container-limits.md
    - name: kubernetes-availability
      rules:
        - alert: NodeNotReady
          expr: max by (k8s_cluster_name, node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "Node {{ $labels.node }} is not Ready"
            description: The node Ready condition has been false or unknown for ten minutes.
        - alert: NodePressure
          expr: max by (k8s_cluster_name, node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"}) == 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
            description: The node has reported resource pressure for ten minutes.
        - alert: DeploymentReplicasUnavailable
          expr: |
            max by (k8s_cluster_name, namespace, deployment) (kube_deployment_spec_replicas)
            > max by (k8s_cluster_name, namespace, deployment) (kube_deployment_status_replicas_available)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} lacks available replicas"
            description: Available replicas have remained below the desired count for fifteen minutes, including stalled rollouts.
        - alert: StatefulSetReplicasUnavailable
          expr: |
            max by (k8s_cluster_name, namespace, statefulset) (kube_statefulset_replicas)
            > max by (k8s_cluster_name, namespace, statefulset) (kube_statefulset_status_replicas_ready)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} lacks ready replicas"
            description: Ready replicas have remained below the desired count for fifteen minutes.
        - alert: DaemonSetPodsUnavailable
          expr: |
            max by (k8s_cluster_name, namespace, daemonset) (kube_daemonset_status_desired_number_scheduled)
            > max by (k8s_cluster_name, namespace, daemonset) (kube_daemonset_status_number_available)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} lacks available Pods"
            description: Available Pods have remained below the desired count for fifteen minutes.
        - alert: ContainerOOMKilled
          expr: |
            (
              max by (k8s_cluster_name, namespace, pod, container) (increase_prometheus(kube_pod_container_status_restarts_total[10m])) > 0
            )
            and on (k8s_cluster_name, namespace, pod, container)
            (
              max by (k8s_cluster_name, namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1
            )
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOM-killed"
            description: A recent restart has OOMKilled as its last termination reason; check the memory limit and workload usage.
    - name: kubernetes-storage
      rules:
        - alert: PersistentVolumeSpaceLow
          expr: |
            (
              min by (k8s_cluster_name, namespace, persistentvolumeclaim) (
                kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)
              ) < 0.15
            )
            and on (k8s_cluster_name, namespace, persistentvolumeclaim)
            (kube_persistentvolumeclaim_info{volumemode="Filesystem"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free space"
            description: Filesystem free space has remained below fifteen percent for fifteen minutes; raw block volumes are excluded.
        - alert: PersistentVolumeSpaceLow
          expr: |
            (
              min by (k8s_cluster_name, namespace, persistentvolumeclaim) (
                kubelet_volume_stats_available_bytes / (kubelet_volume_stats_capacity_bytes > 0)
              ) < 0.05
            )
            and on (k8s_cluster_name, namespace, persistentvolumeclaim)
            (kube_persistentvolumeclaim_info{volumemode="Filesystem"} == 1)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 5% free space"
            description: Filesystem free space has remained below five percent for five minutes; raw block volumes are excluded.
        - alert: PersistentVolumeInodesLow
          expr: |
            (
              min by (k8s_cluster_name, namespace, persistentvolumeclaim) (
                kubelet_volume_stats_inodes_free / (kubelet_volume_stats_inodes > 0)
              ) < 0.1
            )
            and on (k8s_cluster_name, namespace, persistentvolumeclaim)
            (kube_persistentvolumeclaim_info{volumemode="Filesystem"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free inodes"
            description: Filesystem inode availability has remained below ten percent for fifteen minutes.
        - alert: KubePodNotScheduled
          expr: kube_pod_status_scheduled{condition="false"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Pod cannot be scheduled: {{ $labels.namespace }}/{{ $labels.pod }}'
            description: Inspect Pending reasons, affinity, resources and PVC scheduling.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#workloads
        - alert: KubeContainerWaiting
          expr: >-
            max_over_time(kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|InvalidImageName"}[5m])
            == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Container remains in a failure waiting state: {{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }}'
            description: Container remains in a failure waiting state
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#workloads
        - alert: KubeJobFailed
          expr: >-
            (max by (k8s_cluster_name, namespace, job_name) (kube_job_failed{condition="true"}) == 1) unless on
            (k8s_cluster_name, namespace, job_name) ((label_replace((max by (k8s_cluster_name, namespace, job_name)
            (kube_job_created) * on (k8s_cluster_name, namespace, job_name) group_left(owner_name) max by (k8s_cluster_name,
            namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob",owner_is_controller="true"})), "cronjob",
            "$1", "owner_name", "(.+)")) < on (k8s_cluster_name, namespace, cronjob) group_left() (max by (k8s_cluster_name,
            namespace, cronjob) (kube_cronjob_status_last_successful_time)))
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Kubernetes Job failed to complete: {{ $labels.namespace }}/{{ $labels.job_name }}'
            description: Terminal Job failure only. A later successful run of the same CronJob clears earlier failures; retained failed Job history is not deleted.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#workloads
        - alert: KubeCronJobOverdue
          expr: (time() - kube_cronjob_next_schedule_time > 3600) and on (k8s_cluster_name, namespace, cronjob) (kube_cronjob_spec_suspend == 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'CronJob is more than one hour overdue: {{ $labels.namespace }}/{{ $labels.cronjob }}'
            description: Suspended schedules are excluded. Inspect the controller and concurrency policy.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#workloads
        - alert: ContainerCPUThrottlingHigh
          expr: >-
            (sum by (k8s_cluster_name, namespace, pod, container)
            (rate(container_cpu_cfs_throttled_periods_total{container!="",container!="POD"}[5m])) / sum by
            (k8s_cluster_name, namespace, pod, container)
            (rate(container_cpu_cfs_periods_total{container!="",container!="POD"}[5m])) > 0.25) and on (k8s_cluster_name,
            namespace, pod, container) (sum by (k8s_cluster_name, namespace, pod, container)
            (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) / (max by (k8s_cluster_name,
            namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu",unit="core"}) > 0) > 0.8)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Container is heavily throttled near its CPU limit: {{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }}'
            description: Requires sustained throttling above 25% and CPU use above 80% of the limit to avoid tiny-quota idle noise.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#workloads
