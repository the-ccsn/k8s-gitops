apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: seaweedfs
  namespace: grafana
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: storage
  configMapRef:
    name: seaweedfs-dashboard
    key: dashboard.json
