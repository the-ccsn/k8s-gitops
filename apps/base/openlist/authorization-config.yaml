apiVersion: v1
kind: ConfigMap
metadata:
  name: openlist-authorization
  namespace: prod
data:
  authorization.py: "\"\"\"Authorize OpenList sessions by app role and expose configuration read-only.\"\
    \"\"\nimport base64\nimport hashlib\nimport http.client\nimport json\nimport os\nimport re\nimport\
    \ sqlite3\nimport threading\nimport time\nimport urllib.parse\nfrom http.server import BaseHTTPRequestHandler,\
    \ ThreadingHTTPServer\nfrom pathlib import Path\n\nCONFIG_READS = {\n    '/api/admin/' + group + '/'\
    \ + operation\n    for group, operations in {\n        'setting': ['get', 'list'], 'storage': ['get',\
    \ 'list'],\n        'driver': ['list', 'names', 'info'], 'meta': ['get', 'list'],\n        'user':\
    \ ['get', 'list', 'sshkey/list'],\n        'index': ['progress'], 'scan': ['progress'],\n    }.items()\
    \ for operation in operations\n}\nHOP_HEADERS = {'connection', 'keep-alive', 'proxy-authenticate',\n\
    \               'proxy-authorization', 'te', 'trailer', 'transfer-encoding', 'upgrade'}\nSECRET_NAMES\
    \ = re.compile(r'secret|password|pwd|token|cookie|access.?key|api.?key|private.?key|authorization',\
    \ re.I)\n\n\ndef redact(value):\n    if isinstance(value, list):\n        return [redact(item) for\
    \ item in value]\n    if isinstance(value, str):\n        try:\n            decoded = json.loads(value)\n\
    \            if isinstance(decoded, (dict, list)):\n                return json.dumps(redact(decoded))\n\
    \        except ValueError:\n            pass\n        if value.startswith(('http://', 'https://')):\n\
    \            parsed = urllib.parse.urlsplit(value)\n            if parsed.username is not None:\n\
    \                return urllib.parse.urlunsplit(parsed._replace(netloc='[redacted]@' + parsed.netloc.rsplit('@',\
    \ 1)[1]))\n        return value\n    if not isinstance(value, dict):\n        return value\n    result\
    \ = {}\n    for key, item in value.items():\n        if SECRET_NAMES.search(key):\n            result[key]\
    \ = '[redacted]' if item else item\n        elif key == 'value' and SECRET_NAMES.search(str(value.get('key',\
    \ ''))):\n            result[key] = '[redacted]' if item else item\n        elif key == 'addition'\
    \ and isinstance(item, str):\n            try:\n                result[key] = json.dumps(redact(json.loads(item)))\n\
    \            except ValueError:\n                result[key] = '[redacted]'\n        else:\n     \
    \       result[key] = redact(item)\n    return result\n\n\ndef canonical_path(target):\n    path =\
    \ urllib.parse.unquote(urllib.parse.urlsplit(target).path)\n    if '\\\\' in path or '\\x00' in path\
    \ or '//' in path or any(p in ['.', '..'] for p in path.split('/')):\n        raise ValueError('Invalid\
    \ request path')\n    return path\n\n\nclass AccessDenied(Exception):\n    pass\n\n\nclass RoleAuthority:\n\
    \    def __init__(self, credentials, endpoint, required_role):\n        self.credentials = credentials\n\
    \        self.endpoint = urllib.parse.urlsplit(endpoint)\n        self.required_role = required_role\n\
    \        self.lock = threading.RLock()\n        self.token = None\n        self.token_expiry = 0\n\
    \        self.users = {}\n\n    def request(self, method, path, body=None, authorization=None):\n\
    \        connection = http.client.HTTPConnection(self.endpoint.hostname, self.endpoint.port or 80,\
    \ timeout=10)\n        headers = {'Host': self.credentials['hostname'], 'Content-Type': 'application/x-www-form-urlencoded'\
    \ if path == '/oidc/token' else 'application/json'}\n        if authorization:\n            headers['Authorization']\
    \ = 'Bearer ' + authorization\n        try:\n            connection.request(method, path, body, headers)\n\
    \            response = connection.getresponse()\n            data = response.read(2**20)\n      \
    \      if response.status != 200:\n                raise AccessDenied('Identity authorization unavailable')\n\
    \            return json.loads(data)\n        finally:\n            connection.close()\n\n    def\
    \ allows(self, subject):\n        if not subject:\n            return False\n        with self.lock:\n\
    \            now = time.monotonic()\n            cached = self.users.get(subject)\n            if\
    \ cached and cached[0] > now:\n                return cached[1]\n            if now >= self.token_expiry:\n\
    \                data = urllib.parse.urlencode({\n                    'grant_type': 'client_credentials',\
    \ 'client_id': self.credentials['application_id'],\n                    'client_secret': self.credentials['application_secret'],\n\
    \                    'resource': self.credentials['resource'], 'scope': 'all',\n                }).encode()\n\
    \                result = self.request('POST', '/oidc/token', data)\n                self.token =\
    \ result['access_token']\n                self.token_expiry = now + max(0, int(result['expires_in'])\
    \ - 30)\n            roles = self.request('GET', '/api/users/' + urllib.parse.quote(subject, safe='')\
    \ + '/roles', authorization=self.token)\n            allowed = any(role['name'] == self.required_role\
    \ for role in roles)\n            # Never use stale positive decisions after an identity-provider\
    \ failure.\n            if len(self.users) >= 4096:\n                self.users.clear()\n        \
    \    self.users[subject] = (now + 30, allowed)\n            return allowed\n\n\nclass Gate:\n    def\
    \ __init__(self, native_host, native_port, authority, database, site_url):\n        self.native_host,\
    \ self.native_port = native_host, native_port\n        self.authority, self.database = authority,\
    \ database\n        self.site_host = urllib.parse.urlsplit(site_url).netloc\n        self.cache =\
    \ {}\n        self.lock = threading.Lock()\n\n    def admin_token(self):\n        with sqlite3.connect('file:'\
    \ + str(self.database) + '?mode=ro', uri=True) as connection:\n            row = connection.execute(\"\
    select value from x_setting_items where key='token'\").fetchone()\n        if not row or not row[0]:\n\
    \            raise AccessDenied('Configuration reader unavailable')\n        return row[0]\n\n   \
    \ def actor(self, authorization):\n        if not authorization:\n            return None\n      \
    \  if authorization.startswith('Bearer '):\n            authorization = authorization[7:]\n      \
    \  if authorization.startswith('Basic '):\n            try:\n                username = base64.b64decode(authorization[6:],\
    \ validate=True).decode().split(':', 1)[0]\n                with sqlite3.connect('file:' + str(self.database)\
    \ + '?mode=ro', uri=True) as connection:\n                    connection.row_factory = sqlite3.Row\n\
    \                    row = connection.execute('select username,sso_id,role,disabled from x_users where\
    \ username=?', (username,)).fetchone()\n                if not row or row['disabled']:\n         \
    \           raise AccessDenied('Invalid session')\n                # Native WebDAV still validates\
    \ the actual password and path permissions.\n                return dict(row)\n            except\
    \ (ValueError, UnicodeError):\n                raise AccessDenied('Invalid session') from None\n \
    \       digest = hashlib.sha256(authorization.encode()).digest()\n        with self.lock:\n      \
    \      cached = self.cache.get(digest)\n        if cached and cached[0] > time.monotonic():\n    \
    \        return cached[1]\n        connection = http.client.HTTPConnection(self.native_host, self.native_port,\
    \ timeout=10)\n        try:\n            connection.request('GET', '/api/me', headers={'Authorization':\
    \ authorization, 'Host': self.site_host})\n            response = connection.getresponse()\n     \
    \       result = json.loads(response.read(2**20))\n            if response.status != 200 or result.get('code')\
    \ != 200:\n                raise AccessDenied('Invalid session')\n            actor = result['data']\n\
    \        finally:\n            connection.close()\n        with self.lock:\n            if len(self.cache)\
    \ >= 4096:\n                self.cache.clear()\n            self.cache[digest] = (time.monotonic()\
    \ + 5, actor)\n        return actor\n\n    def authorized_actor(self, authorization):\n        actor\
    \ = self.actor(authorization)\n        if actor and actor.get('sso_id') and not self.authority.allows(actor['sso_id']):\n\
    \            raise AccessDenied('Required application role is missing')\n        return actor\n\n\n\
    class Handler(BaseHTTPRequestHandler):\n    protocol_version = 'HTTP/1.1'\n\n    def log_message(self,\
    \ *_):\n        # URLs may contain OIDC codes, download signatures or credentials.\n        pass\n\
    \n    def json_response(self, status, message):\n        body = json.dumps({'code': status, 'message':\
    \ message, 'data': None}).encode()\n        self.send_response(status)\n        self.send_header('Content-Type',\
    \ 'application/json')\n        self.send_header('Content-Length', str(len(body)))\n        self.send_header('Cache-Control',\
    \ 'no-store')\n        self.send_header('Connection', 'close')\n        self.end_headers()\n     \
    \   if self.command != 'HEAD':\n            self.wfile.write(body)\n        self.close_connection\
    \ = True\n\n    def handle_request(self):\n        connection = None\n        try:\n            path\
    \ = canonical_path(self.path)\n            gate = self.server.gate\n            if path == '/healthz':\n\
    \                return self.json_response(200, 'ready')\n            configuration = path == '/api/admin'\
    \ or path.startswith('/api/admin/')\n            if configuration and (self.command != 'GET' or path\
    \ not in CONFIG_READS):\n                return self.json_response(403, 'Configuration is read-only\
    \ and managed by Helm')\n            auth = self.headers.get('Authorization', '')\n            if\
    \ auth.startswith('Basic ') and path.startswith('/api/'):\n                raise AccessDenied('API\
    \ requests require a valid OpenList session')\n            actor = gate.authorized_actor(auth)\n \
    \           manager = bool(actor and actor.get('sso_id') and gate.authority.allows(actor['sso_id']))\n\
    \            if configuration and not manager:\n                raise AccessDenied('Required application\
    \ role is missing')\n            headers = {k: v for k, v in self.headers.items() if k.lower() not\
    \ in HOP_HEADERS}\n            headers['Host'] = gate.site_host\n            headers['Connection']\
    \ = 'close'\n            if auth.startswith('Bearer '):\n                headers['Authorization']\
    \ = auth[7:]\n            if configuration or (manager and path == '/api/fs/link'):\n            \
    \    headers['Authorization'] = gate.admin_token()\n            length = self.headers.get('Content-Length')\n\
    \            transfer = self.headers.get('Transfer-Encoding')\n            if (length and transfer)\
    \ or (transfer and transfer.lower() != 'chunked'):\n                return self.json_response(400,\
    \ 'Invalid request framing')\n            if len(self.headers.get_all('Content-Length', [])) > 1 or\
    \ len(self.headers.get_all('Transfer-Encoding', [])) > 1:\n                return self.json_response(400,\
    \ 'Invalid request framing')\n            payload = None\n            if path == '/api/me/update'\
    \ and actor and actor.get('sso_id'):\n                if transfer or not length or not 0 <= int(length)\
    \ <= 2**20:\n                    return self.json_response(400, 'Invalid profile update')\n      \
    \          profile = json.loads(self.rfile.read(int(length)))\n                if any(key.lower()\
    \ == 'sso_id' and key != 'sso_id' for key in profile):\n                    return self.json_response(400,\
    \ 'Invalid profile field')\n                if profile.get('sso_id') != actor['sso_id']:\n       \
    \             return self.json_response(403, 'SSO identity is managed by the identity provider')\n\
    \                payload = json.dumps(profile).encode()\n                headers['Content-Length']\
    \ = str(len(payload))\n            connection = http.client.HTTPConnection(gate.native_host, gate.native_port,\
    \ timeout=300)\n            connection.putrequest(self.command, self.path, skip_host=True, skip_accept_encoding=True)\n\
    \            if transfer:\n                headers['Transfer-Encoding'] = 'chunked'\n            #\
    \ JSON responses that are filtered must use an uncompressed representation.\n            filtered\
    \ = configuration or path == '/api/me' or path.startswith('/api/auth')\n            if filtered:\n\
    \                headers['Accept-Encoding'] = 'identity'\n            for name, value in headers.items():\n\
    \                connection.putheader(name, value)\n            connection.endheaders()\n        \
    \    if payload is not None:\n                connection.send(payload)\n            elif transfer:\n\
    \                while True:\n                    line = self.rfile.readline(8193)\n             \
    \       if len(line) > 8192 or not line.endswith(b'\\r\\n'):\n                        raise ValueError('Invalid\
    \ chunk')\n                    size = int(line.strip().split(b';')[0], 16)\n                    if\
    \ size < 0:\n                        raise ValueError('Invalid chunk')\n                    if size\
    \ == 0:\n                        total = 0\n                        while True:\n                \
    \            trailer = self.rfile.readline(8193)\n                            total += len(trailer)\n\
    \                            if not trailer or total > 65536:\n                                raise\
    \ ValueError('Invalid trailer')\n                            if trailer == b'\\r\\n':\n          \
    \                      break\n                        connection.send(b'0\\r\\n\\r\\n')\n        \
    \                break\n                    connection.send(('%x\\r\\n' % size).encode())\n      \
    \              remaining = size\n                    while remaining:\n                        block\
    \ = self.rfile.read(min(65536, remaining))\n                        if not block:\n              \
    \              raise ValueError('Incomplete body')\n                        connection.send(block)\n\
    \                        remaining -= len(block)\n                    if self.rfile.read(2) != b'\\\
    r\\n':\n                        raise ValueError('Invalid chunk terminator')\n                   \
    \ connection.send(b'\\r\\n')\n            elif length:\n                remaining = int(length)\n\
    \                if remaining < 0:\n                    raise ValueError('Invalid length')\n     \
    \           while remaining:\n                    block = self.rfile.read(min(65536, remaining))\n\
    \                    if not block:\n                        raise ValueError('Incomplete body')\n\
    \                    connection.send(block)\n                    remaining -= len(block)\n       \
    \     response = connection.getresponse()\n            body = None\n            if filtered:\n   \
    \             body = response.read(8*2**20+1)\n                if len(body) > 8*2**20:\n         \
    \           raise AccessDenied('Configuration response too large')\n                if configuration:\n\
    \                    body = json.dumps(redact(json.loads(body))).encode()\n                elif path\
    \ == '/api/me':\n                    result = json.loads(body)\n                    if result.get('code')\
    \ == 200:\n                        result['data']['role'] = 2 if manager else (1 if result['data'].get('role')\
    \ == 1 else 0)\n                    body = json.dumps(result).encode()\n                elif path.startswith('/api/auth'):\n\
    \                    content_type = response.getheader('Content-Type', '')\n                    if\
    \ 'json' in content_type:\n                        result = json.loads(body)\n                   \
    \     token = (result.get('data') or {}).get('token') if isinstance(result.get('data'), dict) else\
    \ None\n                        if token:\n                            gate.authorized_actor(token)\n\
    \                    else:\n                        text = body.decode('utf-8')\n                \
    \        match = re.search(r'\"token\"\\s*:\\s*\"([^\"]+)\"', text)\n                        if match:\n\
    \                            gate.authorized_actor(match.group(1))\n                        binding\
    \ = re.search(r'\"sso_id\"\\s*:\\s*\"([^\"]+)\"', text)\n                        if binding:\n   \
    \                         # This proof comes directly from the trusted native callback,\n        \
    \                    # after native OIDC signature, issuer, audience and state validation.\n     \
    \                       part = binding.group(1).split('.')[1]\n                            claims\
    \ = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))\n                        \
    \    if not gate.authority.allows(claims['sso_id']):\n                                raise AccessDenied('Required\
    \ application role is missing')\n            self.send_response(response.status)\n            for\
    \ name, value in response.getheaders():\n                if name.lower() in HOP_HEADERS or name.lower()\
    \ == 'content-length' and body is not None:\n                    continue\n                if filtered\
    \ and name.lower() in ['cache-control', 'etag', 'content-encoding']:\n                    continue\n\
    \                self.send_header(name, value)\n            if body is not None:\n               \
    \ self.send_header('Content-Length', str(len(body)))\n            if filtered:\n                self.send_header('Cache-Control',\
    \ 'no-store')\n            self.send_header('Connection', 'close')\n            self.end_headers()\n\
    \            if self.command != 'HEAD':\n                if body is not None:\n                  \
    \  self.wfile.write(body)\n                else:\n                    while True:\n              \
    \          block = response.read(65536)\n                        if not block:\n                 \
    \           break\n                        self.wfile.write(block)\n            self.close_connection\
    \ = True\n        except AccessDenied as error:\n            self.json_response(403, str(error))\n\
    \        except (ValueError, KeyError, IndexError):\n            self.json_response(400, 'Invalid\
    \ request or upstream response')\n        except (OSError, http.client.HTTPException, sqlite3.Error):\n\
    \            self.json_response(503, 'Authorization or upstream unavailable')\n        finally:\n\
    \            if connection:\n                connection.close()\n\n    do_GET = do_HEAD = do_POST\
    \ = do_PUT = do_PATCH = do_DELETE = do_OPTIONS = handle_request\n    do_PROPFIND = do_PROPPATCH =\
    \ do_MKCOL = do_MOVE = do_COPY = do_LOCK = do_UNLOCK = handle_request\n\n\ndef main():\n    credentials\
    \ = json.loads(Path('/logto/credentials').read_text())\n    authority = RoleAuthority(credentials,\
    \ 'http://logto-core.prod.svc.cluster.local:3001', os.environ['REQUIRED_ROLE'])\n    server = ThreadingHTTPServer(('0.0.0.0',\
    \ 5246), Handler)\n    server.daemon_threads = True\n    server.gate = Gate('127.0.0.1', 5244, authority,\
    \ Path('/data/data.db'), os.environ['SITE_URL'])\n    print('OpenList role authorization and read-only\
    \ configuration gateway ready', flush=True)\n    server.serve_forever()\n\n\nif __name__ == '__main__':\n\
    \    main()\n"
