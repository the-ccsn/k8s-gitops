apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: kubelet-resources
  namespace: monitoring
  labels:
    application: kubelet
    component: resources
spec:
  scrapeClass: kubelet-apiserver
  jobName: kubelet
  scheme: https
  metricsPath: /metrics/resource
  scrapeInterval: 30s
  scrapeTimeout: 10s
  sampleLimit: 10000
  honorLabels: true
  honorTimestamps: false
  kubernetesSDConfigs:
    - role: Node
  relabelings:
    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: instance
    - targetLabel: job
      replacement: kubelet
    - targetLabel: metrics_path
      replacement: /metrics/resource
    - targetLabel: __address__
      replacement: kubernetes.default.svc:443
    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: __metrics_path__
      regex: (.+)
      replacement: /api/v1/nodes/${1}/proxy/metrics/resource
    - action: labelmap
      regex: __meta_kubernetes_node_label_(kubernetes_io_(arch|hostname|os)|node_kubernetes_io_instance_type|node_purpose)
      replacement: kubernetes_node_$1
  metricRelabelings:
    # Headlamp and the existing dashboards sum these families without a path
    # filter. cAdvisor owns them; retaining both endpoints would double count.
    # Keep the resource endpoint's node/pod counters and scrape error metric.
    - action: drop
      sourceLabels: [__name__]
      regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|start_time_seconds)
    - action: labeldrop
      regex: (uid|id|name)
---
