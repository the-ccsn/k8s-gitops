apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dragonfly-instances
  namespace: monitoring
  labels:
    application: dragonfly
    component: metrics
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  podMetricsEndpoints:
  - port: admin
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
  sampleLimit: 10000
