apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-qbittorrent
spec:
  exportTo: ["."]
  hosts:
    - qbittorrent.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 8989
      name: http-qbittorrent
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-qbittorrent
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - qb.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: qbittorrent.external-services.mesh.internal
          port: 8989
