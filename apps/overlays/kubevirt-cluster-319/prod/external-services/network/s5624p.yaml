apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-s5624p
spec:
  exportTo: ["."]
  hosts:
    - s5624p.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 80
      name: http-s5624p
      protocol: HTTP
  resolution: DNS
  endpoints:
    # Normalize the legacy switch response before Envoy parses it.
    - address: external-s5624p-compat.prod.svc.cluster.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-s5624p
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - s5624p.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: s5624p.external-services.mesh.internal
          port: 80
