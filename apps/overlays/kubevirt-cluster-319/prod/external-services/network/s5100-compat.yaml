apiVersion: v1
kind: ConfigMap
metadata:
  name: external-s5100-compat
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      large_client_header_buffers 4 32k;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 0;
      server {
        listen 8080;
        location = /healthz { return 200; }
        location / {
          # Buffer chunked requests and generate Content-Length for the legacy server.
          proxy_request_buffering on;
          proxy_http_version 1.0;
          proxy_pass http://192.168.255.3;
          # Authentication is complete at the gateway; keep SSO headers below its limit.
          proxy_pass_request_headers off;
          proxy_set_header Host $http_host;
          proxy_set_header Connection close;
          proxy_set_header Content-Type $http_content_type;
          proxy_set_header Accept $http_accept;
          proxy_set_header User-Agent $http_user_agent;
          proxy_set_header Origin $http_origin;
          proxy_set_header Referer $http_referer;
          # These four cookies are written by the switch login page.
          proxy_set_header Cookie "lang=$cookie_lang; use_lang=$cookie_use_lang; user_name=$cookie_user_name; password=$cookie_password";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-s5100-compat
  labels:
    app.kubernetes.io/name: external-s5100-compat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-s5100-compat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-s5100-compat
      annotations:
        checksum/config: 48a5701d2c9b042279707408f0679a3187187a5df8906b600f039ea2aadc4ef2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: nginx
        image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        args:
        - -e
        - /dev/stderr
        - -g
        - daemon off;
        - -c
        - /etc/nginx/nginx.conf
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        command:
        - nginx
      volumes:
      - name: config
        configMap:
          name: external-s5100-compat
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: external-s5100-compat
spec:
  selector:
    app.kubernetes.io/name: external-s5100-compat
  ports:
  - name: http
    port: 80
    targetPort: http
