otel_exporter {
    endpoint otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317;
    interval 5s;
    batch_size 64;
    batch_count 4;
}
otel_service_name i319-reroute;
otel_resource_attr service.namespace i319-reroute;
otel_resource_attr k8s.namespace.name i319-reroute;

# Honor an extracted parent's decision; sample only new traces at one percent.
split_clients "$otel_trace_id" $ccsn_root_sampled {
    1% 1;
    *  0;
}
map $otel_parent_id $ccsn_trace_sampled {
    ""      $ccsn_root_sampled;
    default $otel_parent_sampled;
}
otel_trace $ccsn_trace_sampled;
otel_trace_context propagate;
otel_span_name "$request_method campus-ingress";
otel_span_attr http.target $uri;
otel_span_attr entrypoint campus;
otel_span_attr request_id $ccsn_request_id;
otel_span_attr cf_ray $http_cf_ray;

map $http_x_request_id $ccsn_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

# Keep sampled requests and HTTP errors, without logging credentials or query strings.
map "$ccsn_trace_sampled:$status" $ccsn_log_request {
    ~^1:                  1;
    ~:[45][0-9][0-9]$     1;
    default               0;
}
log_format ccsn_ingress escape=json
    '{"timestamp":"$time_iso8601","entrypoint":"campus",'
    '"service_name":"i319-reroute","service_namespace":"i319-reroute",'
    '"method":"$request_method","host":"$host","path":"$uri",'
    '"status":$status,"duration_seconds":$request_time,'
    '"upstream_connect_seconds":"$upstream_connect_time",'
    '"upstream_header_seconds":"$upstream_header_time",'
    '"trace_id":"$otel_trace_id","span_id":"$otel_span_id",'
    '"trace_sampled":"$ccsn_trace_sampled","request_id":"$ccsn_request_id",'
    '"cf_ray":"$http_cf_ray"}';
access_log /dev/stdout ccsn_ingress if=$ccsn_log_request;
