apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-vm-state
provisioner: driver.longhorn.io
# Preserve TPM keys even if a claim is accidentally removed.
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fsType: ext4
  dataLocality: best-effort
  backupTargetName: r2-backup
  recurringJobSelector: '[{"name":"r2-backup","isGroup":true}]'
