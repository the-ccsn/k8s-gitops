# Lazy evaluation snapshots durations when add_header runs. The common path
# uses one native regex; retries, redirects and partial measurements use njs.
# Capture pairs in the map value are request, connect, then upstream headers.
js_set $nginx_fallback_timing server_timing.fallback;
map "$request_time|$upstream_connect_time|$upstream_header_time" $nginx_server_timing {
    default $nginx_fallback_timing;
    "~^([0-9]+)\.([0-9]{3})\|([0-9]+)\.([0-9]{3})\|([0-9]+)\.([0-9]{3})$" 'nginx_headers;dur=$1$2;desc="$hostname", nginx_upstream_connect;dur=$3$4;desc="$hostname attempt 1", nginx_upstream_headers;dur=$5$6;desc="$hostname attempt 1"';
    "~^([0-9]+)\.([0-9]{3})\|[-]?\|[-]?$" 'nginx_headers;dur=$1$2;desc="$hostname"';
}
