apiVersion: api.logto.m.crossplane.io/v1alpha1
kind: Resource
metadata:
  name: base-domain-api
  namespace: prod
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  forProvider:
    name: Base API
    indicator: https://base.ccsn.dev/api
    accessTokenTtl: 300
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
apiVersion: api.logto.m.crossplane.io/v1alpha1
kind: Scope
metadata:
  name: base-domain-admin
  namespace: prod
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  forProvider:
    name: base:admin
    description: OpenList Base native administrator
    resourceIdRef:
      name: base-domain-api
      policy:
        resolve: Always
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
apiVersion: api.logto.m.crossplane.io/v1alpha1
