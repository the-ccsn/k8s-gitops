apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: proxy-engine
  namespace: egress-system
spec:
  serviceName: proxy-engine-headless
  replicas: 2
  minReadySeconds: 10
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: proxy-engine
  template:
    metadata:
      labels:
        app: proxy-engine
        istio.io/use-waypoint: none
    spec:
      serviceAccountName: proxy-engine
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: proxy-engine
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fetch-nodes
        image: docker.io/library/python:3.14-alpine@sha256:dd4d2bd5b53d9b25a51da13addf2be586beebd5387e289e798e4083d94ca837a
        envFrom:
        - secretRef:
            name: sub-converter-suburls-secret
        env:
        - name: POD_IPS
          valueFrom:
            fieldRef:
              fieldPath: status.podIPs
        - name: HOME
          value: /tmp
        command: ["python3", "/scripts/update_sub.py"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests: 
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 64Mi
        volumeMounts:
        - name: config-main
          mountPath: /etc/sing-box/main
          readOnly: true
        - name: script-volume
          mountPath: /scripts
          readOnly: true
        - name: nodes-cache
          mountPath: /shared-nodes
        - name: config-temp
          mountPath: /runtime-nodes
        - name: tmp
          mountPath: /tmp
      containers:
      - name: sing-box
        image: ghcr.io/sagernet/sing-box:v1.13.12@sha256:da0e2331395c9025a85fa58892772b4cdbe5f2e530e93defeec3968175d06c6d
        command: 
        - "sing-box"
        - "run"
        - "-D"
        - "/var/lib/sing-box"
        - "-c"
        - "/etc/sing-box/main/main.json"
        - "-c"
        - "/etc/sing-box/temp/nodes.json"
        lifecycle:
          preStop:
            exec:
              command: [/bin/sh, -ec, "sleep 10"]
        ports:
        - containerPort: 7890
          name: mixed-proxy
        - containerPort: 8891
          name: public-http
        - containerPort: 8892
          name: public-v4
        - containerPort: 8893
          name: public-v6
        - containerPort: 8894
          name: campus-http
        - containerPort: 8895
          name: campus-v4
        - containerPort: 8896
          name: campus-v6
        - containerPort: 9090
          name: clash-api
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /version
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /version
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests: 
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 64Mi
        volumeMounts:
        - name: config-temp
          mountPath: /etc/sing-box/main/main.json
          subPath: main.json
          readOnly: true
        - name: config-temp
          mountPath: /etc/sing-box/temp
          readOnly: true
        # Downloads and mutable sing-box state belong to this Pod, not an RWX share.
        - name: work-cache
          mountPath: /var/lib/sing-box
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-main
        configMap:
          name: sing-box-main-config
      - name: config-temp
        emptyDir:
          sizeLimit: 10Mi
      - name: nodes-cache
        persistentVolumeClaim:
          claimName: nodes-cache
      - name: script-volume
        configMap:
          name: sub-converter-script-config
      - name: tmp
        emptyDir:
          sizeLimit: 50Mi
      - name: work-cache
        emptyDir:
          sizeLimit: 100Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proxy-engine
  namespace: egress-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: proxy-engine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxy-dashboard
  namespace: egress-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proxy-dashboard
  namespace: egress-system
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [proxy-engine]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxy-dashboard
  namespace: egress-system
subjects:
  - kind: ServiceAccount
    name: proxy-dashboard
    namespace: egress-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxy-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxy-engine
  namespace: egress-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-dashboard
  namespace: egress-system
spec:
  replicas: 2
  minReadySeconds: 10
  selector:
    matchLabels:
      app: proxy-dashboard
  template:
    metadata:
      labels:
        app: proxy-dashboard
        istio.io/use-waypoint: none
    spec:
      serviceAccountName: proxy-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: proxy-dashboard
              topologyKey: kubernetes.io/hostname
      containers:
      - name: webui
        image: ghcr.io/the-ccsn/metacubexd:sha-81a1be9b191571cf395707b0e705bc28a4acde36@sha256:703e33a8d6794db8e7cc4046d5eb4151674db085d9c9414a75f33b2845a980e1
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: STATEFULSET_NAME
          value: proxy-engine
        - name: PUBLIC_ORIGIN
          value: https://proxy-engine.ccsn.dev
        ports:
        - name: http-webui
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-webui
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proxy-dashboard
  namespace: egress-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: proxy-dashboard
