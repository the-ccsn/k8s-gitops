---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: harbor-dragonfly
  namespace: harbor
spec:
  image: ghcr.io/the-ccsn/dragonfly:v1.40.1-auto-b204b3d41b2c@sha256:73ffbda489e1b16cf2378cad179bc612c1e99a22030d6b0eef0bd604fba9f862
  replicas: 1
  args:
    - --maxmemory=1600mb
    - --cache_mode=true
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 10Mi
  authentication:
    passwordFromSecret:
      name: harbor-redis-auth
      key: REDIS_PASSWORD
