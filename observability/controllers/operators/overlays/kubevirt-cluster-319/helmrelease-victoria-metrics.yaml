kind: will-be-ignored
metadata:
  name: will-be-ignored
spec:
  values:
    kube-state-metrics:
      # K3s controllers use local CST for CronJobs without spec.timeZone.
      env:
        - name: TZ
          value: Asia/Shanghai
    vmagent:
      spec:
        scrapeInterval: 20s
        externalLabels:
          k8s_cluster_name: kubevirt-cluster-319
          deployment_environment_name: production
          ccsn_site_name: ccsn
      ingress:
        hosts:
          - kubevirt-vmagent.ccsn.dev
