---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kubernetes-component-monitors.yaml
  - ./kubernetes-alerts.yaml
  - ./kubernetes-recording-rules.yaml
  - ./node-metrics.yaml
  - ./kubernetes-dashboards.yaml
  - ./kubelet-metrics.yaml

configMapGenerator:
  - name: kubernetes-upstream-dashboards
    namespace: grafana
    files:
      - kubernetes-cluster.json
      - kubernetes-namespace.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
