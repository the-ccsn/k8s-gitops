---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./default-tunnel-secret.yaml
  - ../../../base/cloudflare-operator/

patches:
  - path: ./default-tunnel-patch.yaml
    target:
      group: networking.cfargotunnel.com
      kind: Tunnel
      name: default-tunnel
      namespace: cloudflare-operator-system
  - target:
      group: networking.cfargotunnel.com
      kind: TunnelBinding
      name: zz-clustername-gateway
      namespace: cloudflare-operator-system
    patch: |-
      - op: replace
        path: /metadata/name
        value: zz-kubevirt-cluster-319-gateway
  - target:
      group: networking.cfargotunnel.com
      kind: TunnelBinding
      name: zz-clustername-gateway
      namespace: cloudflare-operator-system
    patch: |-
      - op: replace
        path: /subjects/0/spec/fqdn
        value: "*.kubevirt-cluster-319.ccsn.dev"
  - target:
      group: externaldns.k8s.io
      kind: DNSEndpoint
      name: cloudflare-tunnel-dns-binding
      namespace: cloudflare-operator-system
    patch: |-
      - op: replace
        path: /spec/endpoints/0/dnsName
        value: "*.kubevirt-cluster-319.ccsn.dev"
