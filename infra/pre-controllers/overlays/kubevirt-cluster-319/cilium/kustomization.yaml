---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - ./cilium-ip-pools.yaml
  - ./cilium-bgp-auth.yaml
  - ./cilium-bgp-eip-lb.yaml

configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
