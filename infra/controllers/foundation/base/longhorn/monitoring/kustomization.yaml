apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./service-monitor.yaml
  - ./rules.yaml
  - ./dashboard.yaml
  - ./persistent-volumes-dashboard.yaml

configMapGenerator:
  - name: longhorn-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
