apiVersion: role.logto.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: share-admin
  namespace: prod
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  forProvider:
    name: share:admin
    description: share OpenList native administrator via verified resource access tokens
    type: User
    isDefault: false
    scopeIdsRefs:
    - name: share-admin
      policy:
        resolve: Always
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
