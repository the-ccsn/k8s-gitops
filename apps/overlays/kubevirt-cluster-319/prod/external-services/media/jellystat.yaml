apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-jellystat
spec:
  exportTo: ["."]
  hosts:
    - jellystat.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 13100
      name: http-jellystat
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-jellystat
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - jellystat.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: jellystat.external-services.mesh.internal
          port: 13100
