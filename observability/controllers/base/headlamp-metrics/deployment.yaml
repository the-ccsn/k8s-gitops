apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-metrics
  labels:
    app.kubernetes.io/name: headlamp-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp-metrics
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: headlamp-metrics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query-proxy
          # The regular Alpine image includes njs; do not substitute alpine-slim.
          image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          command: [nginx]
          args: [-e, /dev/stderr, -g, "daemon off;", -c, /etc/headlamp-metrics/nginx.conf]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            timeoutSeconds: 20
            periodSeconds: 30
          # A backend outage should remove readiness without restarting Nginx.
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/headlamp-metrics
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: headlamp-metrics-config
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
