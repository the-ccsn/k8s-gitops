---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  releaseName: otel-collector
  interval: 30m
  install:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: helm-chart-opentelemetry-collector
    namespace: monitoring
  # https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
  values:
    podLabels:
      istio.io/dataplane-mode: ambient
    image:
      repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
    command:
      name: "otelcol-k8s"

    mode: daemonset
    replicaCount: 1
    # DaemonSet Services are off by default; Istio and SDKs need a stable OTLP endpoint.
    service:
      enabled: true
    # Keep the Go memory target below the 512Mi pod limit alongside memory_limiter.
    useGOMEMLIMIT: true
    rollout:
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    # The checkpoint preset writes a root-owned hostPath. No extra host capabilities are needed.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
      otlp:
        hostPort: null
      otlp-http:
        hostPort: null
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: true
    # https://opentelemetry.io/docs/kubernetes/collector/components/
    presets:
      kubernetesAttributes:
        enabled: true
      # Collect infra's logs via filelog.
      # NOTE: application-level logs should be sent to otel via sdk direcly, instead of print into stdout/stderr.
      logsCollection:
        enabled: true
        storeCheckpoints: true
        # Do not include the collector itself's log, to prevent log looping
        includeCollectorLogs: false

    config:
      extensions:
        file_storage:
          directory: /var/lib/otelcol
          fsync: true
          recreate: false
        file_storage/queues:
          directory: /var/lib/otelcol/queues
          create_directory: true
          fsync: true
          recreate: false
          compaction:
            on_rebound: true
            directory: /var/lib/otelcol/queues-compaction
            rebound_needed_threshold_mib: 64
            rebound_trigger_threshold_mib: 16
      receivers:
        jaeger: null
        prometheus: null
        zipkin: null
        filelog:
          exclude:
            - /var/log/pods/monitoring_otel-collector-opentelemetry-collector*_*/opentelemetry-collector/*.log
            - /var/log/pods/monitoring_otel-events*_*/opentelemetry-collector/*.log
          include:
            - /var/log/pods/*/*/*.log
          include_file_name: false
          include_file_path: true
          operators:
            # Step 1: Use the container operator to parse the container runtime log header.
            # It strips the timestamp and stream (stdout/stderr) and places the application log itself into the 'body' field.
            # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/pkg/stanza/docs/operators/container.md
            - id: container-parser
              type: container
              max_log_size: 102400
            # Drop legacy OAuth warnings that contain opaque access tokens.
            - type: filter
              expr: 'body matches "token is not in JWT format:"'
            # Step 2: Try to parse logs in JSON format.
            - type: json_parser
              if: 'body matches "^{.*}$"'
              on_error: send_quiet
              # Parse the 'body' field as JSON and place the results into 'attributes'.
              parse_to: attributes
              # Use the severity configuration block to extract the level.
              severity:
                # First, try to parse from the 'attributes.level' field.
                parse_from: attributes.level
            # Keep Flux's large apply-result map in the JSON body; duplicating it
            # as flattened metadata can exceed Loki's 128-entry limit.
            - type: remove
              field: attributes.output
              if: 'attributes.controllerGroup == "kustomize.toolkit.fluxcd.io" && attributes.output != nil'
            # Promote structured ingress IDs into the OTLP LogRecord context.
            - type: remove
              field: attributes.span_id
              if: 'attributes.span_id != nil && (attributes.span_id not matches "^[0-9a-f]{16}$" || attributes.span_id == "0000000000000000")'
            - type: trace_parser
              if: 'attributes.trace_id != nil && attributes.trace_id matches "^[0-9a-f]{32}$" && attributes.trace_id != "00000000000000000000000000000000"'
              on_error: send_quiet
              trace_id:
                parse_from: attributes.trace_id
              span_id:
                parse_from: attributes.span_id
            # Loki obtains these from the OTLP context, avoiding duplicate keys
            # and bogus links for Envoy's missing-ID placeholder.
            - type: remove
              field: attributes.trace_id
              if: 'attributes.trace_id != nil'
            - type: remove
              field: attributes.span_id
              if: 'attributes.span_id != nil'
            # Step 3: Parse logs in plain text format.
            - type: regex_parser
              if: 'attributes.level == nil'
              on_error: send_quiet
              # Regex to capture common log level keywords from the text.
              regex: \b(?P<level>(?i)(DEBUG|INFO|WARN|WARNING|ERROR|ERR|FATAL|CRITICAL))\b
              # Use the severity configuration block to normalize the captured level.
              severity:
                parse_from: attributes.level
                # Establish a mapping to unify different captured strings into standard OTEL levels.
                mapping:
                  debug: debug
                  info: info
                  warn:
                    - warn
                    - warning
                  error:
                    - error
                    - err
                    - fatal
                    - critical
            # Step 4 (Final Step): Set a default severity if it was not parsed successfully.
            - type: add
              # This 'if' condition checks if the 'level' field was NOT set by previous parsers.
              if: 'attributes.level == nil'
              # If it wasn't set, add the field with a value of "unknown".
              field: attributes.level
              value: "unknown"
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          # Resume stored offsets; read unseen files from the beginning, including files created while down.
          start_at: beginning
      exporters:
        otlphttp:
          endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
          headers:
            # loki require such a ID by default
            X-Scope-OrgID: "fake"
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            storage: file_storage/queues
            sizer: bytes
            queue_size: 134217728
            num_consumers: 2
            block_on_overflow: true
        otlp/tempo:
          endpoint: tempo.monitoring.svc.cluster.local:4317
          tls:
            insecure: true
          retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 0s
          sending_queue:
            enabled: true
            storage: file_storage/queues
            sizer: bytes
            queue_size: 134217728
            num_consumers: 2
            block_on_overflow: true
        debug: null

      processors:
        # A batch processor acknowledges input before it reaches the durable exporter queue.
        batch: null
        k8sattributes:
          passthrough: false
          extract:
            # Extract pod labels
            labels:
              # Standard service identity fallback and one component-specific resource.
              - key: "app.kubernetes.io/name"
                tag_name: "k8s.pod.label.app_kubernetes_io_name"
              - key: "app"
                tag_name: "k8s.pod.label.app"
              - key: "cnpg.io/cluster"
                tag_name: "cnpg.cluster.name"

            # Extract all pod annotations
            # annotations:
            #   - from: pod
            #     key_regex: (.*)
            #     tag_name: $$1
            metadata:
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.pod.start_time
              - k8s.container.name
              - k8s.node.name
              - k8s.namespace.name
              - k8s.deployment.name
              - k8s.statefulset.name
              - k8s.daemonset.name
              - k8s.cronjob.name
              - k8s.job.name
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: resource_attribute
                  name: k8s.pod.name
                - from: resource_attribute
                  name: k8s.namespace.name
                - from: resource_attribute
                  name: k8s.node.name
            - sources:
                - from: connection

        # https://opentelemetry.io/docs/collector/transforming-telemetry/
        transform:
          log_statements:
            - context: resource
              statements:
                # Preserve SDK identity; derive missing log identity from the Pod.
                - set(resource.attributes["service.name"], resource.attributes["k8s.pod.label.app_kubernetes_io_name"])
                  where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.label.app_kubernetes_io_name"] != nil
                - set(resource.attributes["service.name"], resource.attributes["k8s.pod.label.app"])
                  where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.label.app"] != nil
                - set(resource.attributes["service.name"], resource.attributes["k8s.pod.name"])
                  where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.name"] != nil
                - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
                  where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
                - set(resource.attributes["k8s.cluster.name"], "kubevirt-cluster-319")
                  where resource.attributes["k8s.cluster.name"] == nil
                - set(resource.attributes["deployment.environment.name"], "production")
                  where resource.attributes["deployment.environment.name"] == nil
                - set(resource.attributes["ccsn.site.name"], "ccsn")
                  where resource.attributes["ccsn.site.name"] == nil
                - delete_matching_keys(resource.attributes, "^k8s\\.pod\\.label\\..*")
            - context: log
              conditions:
                - attributes["ccsn.ingress.entrypoint"] == "campus" or attributes["ccsn.ingress.entrypoint"] == "istio"
              statements:
                - set(resource.attributes["service.name"], attributes["service_name"])
                  where attributes["service_name"] != nil
                - set(resource.attributes["service.namespace"], attributes["service_namespace"])
                  where attributes["service_namespace"] != nil
                - delete_key(attributes, "service_name") where attributes["service_name"] != nil
                - delete_key(attributes, "service_namespace") where attributes["service_namespace"] != nil
                - set(severity_number, SEVERITY_NUMBER_ERROR)
                  where (attributes["ccsn.ingress.entrypoint"] == "campus" or attributes["ccsn.ingress.entrypoint"] == "istio")
                  and Int(attributes["status"]) >= 500
                - set(severity_number, SEVERITY_NUMBER_WARN)
                  where (attributes["ccsn.ingress.entrypoint"] == "campus" or attributes["ccsn.ingress.entrypoint"] == "istio")
                  and Int(attributes["status"]) >= 400 and Int(attributes["status"]) < 500
                - set(severity_number, SEVERITY_NUMBER_INFO)
                  where (attributes["ccsn.ingress.entrypoint"] == "campus" or attributes["ccsn.ingress.entrypoint"] == "istio")
                  and Int(attributes["status"]) < 400
                # Loki's rules consume OTLP severity text as well as its number.
                - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
                - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
                - set(severity_text, "INFO") where severity_number == SEVERITY_NUMBER_INFO
          trace_statements:
            - context: resource
              statements:
                - set(resource.attributes["k8s.cluster.name"], "kubevirt-cluster-319")
                  where resource.attributes["k8s.cluster.name"] == nil
                - set(resource.attributes["deployment.environment.name"], "production")
                  where resource.attributes["deployment.environment.name"] == nil
                - set(resource.attributes["ccsn.site.name"], "ccsn")
                  where resource.attributes["ccsn.site.name"] == nil
            - context: span
              conditions:
                - attributes["ccsn.ingress.entrypoint"] == "campus" or attributes["ccsn.ingress.entrypoint"] == "istio"
              statements:
                - set(attributes["ccsn.request.id"], attributes["istio.proxy.request_id"])
                  where (attributes["ccsn.request.id"] == nil or attributes["ccsn.request.id"] == "")
                  and attributes["istio.proxy.request_id"] != nil
                - delete_key(attributes, "istio.proxy.request_id")
                # Envoy's native HTTP URL includes the query string by default.
                - 'replace_pattern(attributes["http.url"], "\\?.*$", "") where attributes["http.url"] != nil'
                - 'replace_pattern(attributes["http.target"], "\\?.*$", "") where attributes["http.target"] != nil'

      service:
        extensions: [health_check, file_storage, file_storage/queues]
        pipelines:
          logs:
            receivers: [otlp, filelog]
            processors: [memory_limiter, k8sattributes, transform]
            exporters: [otlphttp]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, transform]
            exporters: [otlp/tempo]
          metrics: null # we use vmagent for metrics collecting.
