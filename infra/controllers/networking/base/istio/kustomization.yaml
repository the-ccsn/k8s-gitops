---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - ./kustomizeconfig.yaml
resources:
  - ./helm-oci-repo.yaml
  - ./istio-base.yaml
  - ./istio-cni.yaml
  - ./istiod.yaml
  - ./ztunnel.yaml
  - ./cilium-allow-ambient.yaml
  - ./server-timing-loader.yaml
configMapGenerator:
  - name: istio-server-timing
    namespace: istio-system
    files:
      - server-timing-values.yaml
  - name: istio-server-timing-binaries
    namespace: istio-system
    files:
      - server-timing-amd64.so=server-timing-amd64.module
      - server-timing-arm64.so=server-timing-arm64.module
