---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: core-dns
  namespace: monitoring
  labels:
    application: core-dns
    component: control-plane
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      port: http-metrics
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/component: core-dns
      app.kubernetes.io/instance: victoriametrics
      app.kubernetes.io/name: vmks
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    application: kube-state-metrics
    component: control-plane
spec:
  endpoints:
    - honorLabels: true
      metricRelabelings:
        - action: labeldrop
          regex: (uid|container_id|image_id)
      port: http
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/instance: victoriametrics
      app.kubernetes.io/name: kube-state-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-api-server
  namespace: monitoring
  labels:
    application: kube-api-server
    component: control-plane
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      port: https
      scheme: https
      metricRelabelings:
        # K3s also exposes kubelet metrics here; the node scrape owns them.
        - action: drop
          sourceLabels: [__name__]
          regex: (kubelet|volume_manager|storage_operation|csi)_.*
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        serverName: kubernetes
  jobLabel: component
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
---
apiVersion: monitoring.coreos.com/v1
