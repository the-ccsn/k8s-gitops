apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: loki-components
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
    matchExpressions:
      # The NGINX gateway's HTTP port does not serve Prometheus metrics.
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [gateway]
  podMetricsEndpoints:
    - path: /metrics
      interval: 15s
      port: http-metrics
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_app_kubernetes_io_component
          separator: /
          regex: (.*)/(.*)/(.*)
          replacement: ${1}/${2}-${3}
          targetLabel: job
          action: replace
