apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: tempo
spec:
  type: otel
  address: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-events
spec:
  providerRef:
    name: tempo
  # Forward local success and error events. Omitted namespaces default to this Alert's namespace.
  eventSeverity: info
  eventSources:
    - kind: Bucket
      name: '*'
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
    - kind: HelmChart
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: ArtifactGenerator
      name: '*'
    - kind: ExternalArtifact
      name: '*'
