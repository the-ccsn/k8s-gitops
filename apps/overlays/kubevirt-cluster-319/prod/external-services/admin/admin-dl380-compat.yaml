# iLO negotiates TLS 1.2 with P-384, which is absent from Envoy's default curves.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: external-admin-dl380-compat
spec:
  priority: 10
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: default-gateway
  configPatches:
    - applyTo: CLUSTER
      match:
        context: GATEWAY
        cluster:
          service: admin-dl380.external-services.mesh.internal
          portNumber: 443
      patch:
        operation: MERGE
        value:
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_params:
                  ecdh_curves:
                    - P-384
