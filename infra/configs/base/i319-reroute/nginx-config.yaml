apiVersion: v1
kind: ConfigMap
metadata:
  name: i319-reroute-nginx-config
data:
  nginx.conf: |
    load_module /etc/nginx/native-modules/ngx_http_ccsn_server_timing_module.so;

    # Enable PCRE JIT for maximum regex performance
    pcre_jit on;
    worker_processes auto;

    events {
        # Set max worker connections
        worker_connections 10240;
        multi_accept on;
    }

    http {
        include /etc/nginx/server-timing/server-timing-http.conf;

        # Disable access log for gigabit throughput
        access_log off;
        error_log /var/log/nginx/error.log warn;

        # Basic Settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' '';
        }

        include /etc/nginx/conf.d/*.conf;
    }
