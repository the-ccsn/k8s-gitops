---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-oci-repo.yaml
  - ./helm-release.yaml
  - ./helm-release-events.yaml
  - ./pvc-events.yaml
  - ./service-monitor.yaml
  - ./pod-monitor.yaml
  - ./rules.yaml
  - ./dashboard.yaml

configMapGenerator:
  - name: otel-collector-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
