# Restrict the separate metrics listener; application ports keep their policy.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: harbor-metrics
  namespace: harbor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/instance: harbor
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
      to:
        - operation:
            ports: ["8001"]
    - to:
        - operation:
            notPorts: ["8001"]
