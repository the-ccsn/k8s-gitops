apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
              # The existing self-probe calls the exporter's own Service.
              - cluster.local/ns/monitoring/sa/blackbox-exporter
      to:
        - operation:
            ports: ["9115"]
    - to:
        - operation:
            notPorts: ["9115"]
