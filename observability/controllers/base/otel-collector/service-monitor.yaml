apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    application: opentelemetry-collector
    component: telemetry
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      # Agent metrics are scraped by otel-collector-agents PodMonitor.
      app.kubernetes.io/instance: otel-events
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
