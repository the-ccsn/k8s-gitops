apiVersion: application.logto.m.crossplane.io/v1alpha1
kind: Secret
metadata:
  name: cloudflare-access-credential
  namespace: prod
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  forProvider:
    name: GitOps
    applicationIdRef:
      name: cloudflare-access
      policy:
        resolve: Always
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
  writeConnectionSecretToRef:
    name: cloudflare-access-oidc
