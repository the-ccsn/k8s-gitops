apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-monitoring
  namespace: monitoring
  labels:
    app: monitoring
spec:
  groups:
    - name: application-monitoring
      rules:
        - alert: PodFrequentlyRestarting
          expr: |
            sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is frequently restarting"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last hour"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: PodNotReady
          expr: |
            (kube_pod_status_ready{condition="true"} == 0)
            unless on (cluster, namespace, pod)
            (kube_pod_status_phase{phase="Succeeded"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready for more than 5 minutes"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: HighMemoryUsage
          expr: |
            (
              max by (cluster, namespace, pod, container) (
                container_memory_working_set_bytes{container!="", container!="POD", pod!=""}
              )
              / max by (cluster, namespace, pod, container) (
                kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0
              )
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory usage > 90%"
            description: "Container memory usage is {{ $value | humanizePercentage }}"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: HighCpuUsage
          expr: |
            (
              sum by (cluster, namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{container!="", container!="POD", pod!=""}[5m])
              )
              / max by (cluster, namespace, pod, container) (
                kube_pod_container_resource_limits{resource="cpu", unit="core"} > 0
              )
            ) > 0.9
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU usage > 90%"
            description: "CPU usage is {{ $value | humanizePercentage }}"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: ContainerMemoryLimitMissing
          expr: |
            (
              max by (cluster, namespace, pod, container) (
                kube_pod_container_info or kube_pod_init_container_info
              )
              unless on (cluster, namespace, pod, container)
              (
                (kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0)
                or (kube_pod_init_container_resource_limits{resource="memory", unit="byte"} > 0)
              )
            )
            and on (cluster, namespace, pod)
            (kube_pod_status_phase{phase!~"Succeeded|Failed"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no memory limit"
            description: "An application or init container in an active Pod has no positive memory limit"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
        - alert: ContainerCpuLimitMissing
          expr: |
            (
              max by (cluster, namespace, pod, container) (
                kube_pod_container_info or kube_pod_init_container_info
              )
              unless on (cluster, namespace, pod, container)
              (
                (kube_pod_container_resource_limits{resource="cpu", unit="core"} > 0)
                or (kube_pod_init_container_resource_limits{resource="cpu", unit="core"} > 0)
              )
            )
            and on (cluster, namespace, pod)
            (kube_pod_status_phase{phase!~"Succeeded|Failed"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has no CPU limit"
            description: "An application or init container in an active Pod has no positive CPU limit"
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/workload-health.md
