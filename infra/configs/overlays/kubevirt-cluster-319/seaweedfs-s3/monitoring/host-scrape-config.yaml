apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: omv-node-exporter
  namespace: monitoring
  labels:
    application: openmediavault
    component: host
spec:
  jobName: node-exporter
  scrapeInterval: 30s
  scrapeTimeout: 10s
  metricsPath: /node/metrics
  scheme: HTTPS
  sampleLimit: 10000
  tlsConfig:
    insecureSkipVerify: false
    ca:
      secret:
        name: seaweedfs-metrics-client-tls
        key: ca.crt
    cert:
      secret:
        name: seaweedfs-metrics-client-tls
        key: tls.crt
    keySecret:
      name: seaweedfs-metrics-client-tls
      key: tls.key
  staticConfigs:
    - targets: [openmediavault.local:9443]
  relabelings:
    - action: replace
      targetLabel: job
      replacement: node-exporter
    - action: replace
      targetLabel: node
      replacement: openmediavault-1
    - action: replace
      targetLabel: application
      replacement: openmediavault
    - action: replace
      targetLabel: component
      replacement: host
