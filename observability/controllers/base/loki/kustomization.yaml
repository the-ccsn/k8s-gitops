---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-oci-repo.yaml
  - ./helm-release.yaml
  - ./availability-probe.yaml
  - ./pod-monitor.yaml
  - ./dashboard.yaml
  - ./platform-dashboard.yaml
  - ./rules.yaml
  - ./application-log-rules.yaml

configMapGenerator:
  - name: loki-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
