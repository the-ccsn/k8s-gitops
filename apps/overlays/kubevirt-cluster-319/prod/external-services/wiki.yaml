apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-wiki
spec:
  exportTo: ["."]
  hosts:
    - wiki.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 3080
      name: http-wiki
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-wiki
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - wiki.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: wiki.external-services.mesh.internal
          port: 3080
