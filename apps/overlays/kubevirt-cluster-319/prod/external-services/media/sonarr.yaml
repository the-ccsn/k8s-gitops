apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-sonarr
spec:
  exportTo: ["."]
  hosts:
    - sonarr.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 18989
      name: http-sonarr
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-sonarr
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - sonarr.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: sonarr.external-services.mesh.internal
          port: 18989
