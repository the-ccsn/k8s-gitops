apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: tls-certificates
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: networking
  json: |-
    {
      "title": "TLS Certificates",
      "uid": "tls-certificates",
      "tags": [
        "blackbox",
        "tls"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Days Until Expiry",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "(probe_ssl_earliest_cert_expiry - time()) / 86400",
              "legendFormat": "{{probe_path}} {{ip_family}} {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTPS Success",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "probe_success{probe_path=~\"public-external|site-direct\"}",
              "legendFormat": "{{probe_path}} {{ip_family}} {{instance}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: network-bandwidth
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: networking
  json: |-
    {
      "title": "Network Bandwidth",
      "uid": "network-bandwidth",
      "tags": [
        "network",
        "bandwidth"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Host Receive",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "node:network_receive_bytes:rate5m * 8",
              "legendFormat": "{{node}} {{device}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Host Transmit",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "node:network_transmit_bytes:rate5m * 8",
              "legendFormat": "{{node}} {{device}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "SNMP Receive",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "device:interface_receive_bytes:rate5m * 8",
              "legendFormat": "{{device_id}} {{ifName}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "SNMP Transmit",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "device:interface_transmit_bytes:rate5m * 8",
              "legendFormat": "{{device_id}} {{ifName}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
