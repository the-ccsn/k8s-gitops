apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-uptime-kuma
spec:
  exportTo: ["."]
  hosts:
    - up-direct.local
  location: MESH_EXTERNAL
  ports:
    - number: 80
      name: http-uptime-kuma
      protocol: HTTP
  resolution: DNS
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-uptime-kuma
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - up.ccsn.dev
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: up-direct.local
          port: 80
