---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  interval: 30m
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      version: "1.*"
      interval: 12h
  values:
    existingSecretAdminPassword: harbor-admin-auth
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

    expose:
      type: route
      route:
        hosts:
        - harbor.ccsn.dev
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-gateway
          namespace: prod
      tls:
        enabled: false
    externalURL: https://harbor.ccsn.dev

    # Route Harbor's outbound requests through the cluster egress proxy.
    proxy:
      httpProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      httpsProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      noProxy: 127.0.0.1,localhost,.svc,.cluster.local,harbor.harbor.svc,core,jobservice,registry,portal

    database:
      type: external
      external:
        host: harbor-pg-cluster-rw
        port: 5432
        username: app
        existingSecret: harbor-pg-cluster-app
        coreDatabase: registry
    redis:
      type: external
      external:
        addr: harbor-dragonfly:6379
        username: default
        # Use an existing secret to connect to Dragonfly. The key must be REDIS_PASSWORD.
        existingSecret: harbor-redis-auth

    # Disable scanners to reduce footprint; can be enabled later.
    trivy:
      enabled: false

    # Shared filesystem volumes allow Registry and Jobservice to overlap on updates.
    updateStrategy:
      type: RollingUpdate

    registry:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    jobservice:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

    persistence:
      enabled: true
      resourcePolicy: keep
      storageClass: longhorn
      persistentVolumeClaim:
        registry:
          size: 100Gi
          existingClaim: harbor-registry-rwx
          accessMode: ReadWriteMany
        jobservice:
          jobLog:
            size: 5Gi
            existingClaim: harbor-jobservice-rwx
            accessMode: ReadWriteMany
        database:
          size: 10Gi
        redis:
          size: 5Gi

  valuesFrom:
    - kind: Secret
      name: harbor-oidc
      valuesKey: values.yaml

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: ConfigMap
              name: harbor-core
              namespace: harbor
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: harbor-core
                namespace: harbor
              data:
                PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: "ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr"
                REPLICATION_ADAPTER_WHITELIST: "ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr"
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: harbor-registry
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-registry
                namespace: harbor
              spec:
                minReadySeconds: 10
                template:
                  spec:
                    initContainers:
                      - name: verify-rwx-migration
                        image: docker.io/library/python:3.14-alpine@sha256:dd4d2bd5b53d9b25a51da13addf2be586beebd5387e289e798e4083d94ca837a
                        command: [/bin/sh, -ec, "test -s /migration/.rwx-migration-complete"]
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        volumeMounts:
                          - name: registry-data
                            mountPath: /migration
                            readOnly: true
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: harbor-jobservice
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-jobservice
                namespace: harbor
              spec:
                minReadySeconds: 10
                template:
                  spec:
                    initContainers:
                      - name: verify-rwx-migration
                        image: docker.io/library/python:3.14-alpine@sha256:dd4d2bd5b53d9b25a51da13addf2be586beebd5387e289e798e4083d94ca837a
                        command: [/bin/sh, -ec, "test -s /migration/.rwx-migration-complete"]
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        volumeMounts:
                          - name: job-logs
                            mountPath: /migration
                            readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-registry-rwx
  namespace: harbor
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-jobservice-rwx
  namespace: harbor
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
