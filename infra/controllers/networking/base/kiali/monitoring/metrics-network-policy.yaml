# The operator's generated policy allows 20001/9090. Ambient connections arrive
# over HBONE; ztunnel separately authorizes their original destination ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiali-ambient
  namespace: kiali-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kiali
      app.kubernetes.io/instance: kiali
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 15008
