# Node-local hostPath storage supports filesystem/RWO, not shared VM disks.
# CDI cannot infer these capabilities from the custom provisioner name.
apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: local-path
spec:
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  cloneStrategy: copy
