# https://fluxcd.io/flux/components/helm/helmreleases/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: prod
spec:
  releaseName: headlamp
  interval: 30m
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: helm-repo-headlamp
      version: "0.42.0"
      interval: 12h
  values:
    httpRoute:
      enabled: true
      # Optional: annotations on the HTTPRoute resource
      annotations: {}
      # Optional: additional labels for the HTTPRoute
      labels: {}
      parentRefs:
        - name: default-gateway
      hostnames:
        - headlamp.ccsn.dev
      # Optional: custom routing rules. If omitted, chart defaults to path prefix '/'
      # rules:
      #   - matches:
      #       - path:
      #           type: Prefix
      #           value: "/"

    config:
      # baseURL: https://headlamp.ccsn.dev
      watchPlugins: true
      oidc:
        clientID: "${clientId}"
        issuerURL: "https://login.ccsn.dev/oidc"
        scopes: "openid email profile offline_access roles"
        usePKCE: true
        useCookie: false
        meUserInfoURL: "https://login.ccsn.dev/oidc/me"

    # Resource requests and limits for Headlamp pod
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

    podSecurityContext:
      fsGroup: 101

    # cert-manager 0.1.1 is published as an archive, without a versioned OCI image.
    # Keep this exception outside Renovate's image-volume tracking.
    pluginsManager:
      enabled: true
      baseImage: node:24-alpine
      version: "0.1.1"
      env:
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      configContent: |-
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: "0.1.1"

    # Plugin volumes and mounts (mount plugin images into /headlamp/plugins/...)
    volumes:
      - name: plugin-flux
        image:
          reference: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
          pullPolicy: IfNotPresent
      - name: plugin-kubevirt
        image:
          reference: ghcr.io/naval-group/headlamp-kubevirt:0.3.1
          pullPolicy: IfNotPresent
    volumeMounts:
      - name: plugin-flux
        mountPath: /headlamp/plugins/flux
        subPath: plugins/flux/
      - name: plugin-kubevirt
        mountPath: /headlamp/plugins/kubevirt
        subPath: plugins/kubevirt/
