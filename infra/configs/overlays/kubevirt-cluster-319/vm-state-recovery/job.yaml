apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-ubuntu-desktop-demo-tpm
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: kubevirt-dl380
      containers:
        - name: copy-state
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - /bin/sh
            - -c
            - "set -eu\nmarker=/target/.ccsn-migrated-from-local-path\nif [ -f
              \"$marker\"\
              \ ]; then\n  echo \"Migration already completed\"\n  exit 0\nfi\n# The VM\
              \ must be halted before this job starts; the old volume is read-only.\n\
              tar -C /source -cf - . | tar -C /target -xf -\n(cd /source && find . -type\
              \ f -exec sha256sum '{}' ';' | sort) > /tmp/source.sha256\n(cd /target &&\
              \ find . -type f ! -path './lost+found/*' -exec sha256sum '{}' ';' | sort)\
              \ > /tmp/target.sha256\ncmp /tmp/source.sha256 /tmp/target.sha256\nchown\
              \ -R 107:107 /target\nprintf '%s\\n'
              'persistent-state-for-ubuntu-desktop-demo-mlmrg'\
              \ > \"$marker\"\nchown 107:107 \"$marker\"\necho \"State copied and
              verified;\
              \ source volume preserved\"\n"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: persistent-state-for-ubuntu-desktop-demo-mlmrg
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: persistent-state-for-ubuntu-desktop-demo-longhorn
