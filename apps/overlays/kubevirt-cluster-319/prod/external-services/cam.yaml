apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-cam
spec:
  exportTo: ["."]
  hosts:
    - cam.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 8800
      name: http-cam
      protocol: HTTP
  resolution: STATIC
  endpoints:
    - address: 192.168.1.11
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-cam
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - cam.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: cam.external-services.mesh.internal
          port: 8800
