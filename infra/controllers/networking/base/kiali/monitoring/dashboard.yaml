apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: kiali
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  json: |-
    {
      "title": "Kiali",
      "uid": "kiali",
      "tags": [
        "kiali",
        "istio"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Kiali Up",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "up{job=\"monitoring/kiali\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "API Requests",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (route) (rate(kiali_api_processing_duration_seconds_count[5m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "API Latency p95",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kiali_api_processing_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        }
      ]
    }
