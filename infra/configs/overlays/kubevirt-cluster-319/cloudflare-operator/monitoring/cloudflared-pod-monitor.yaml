apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared-tunnels
  namespace: monitoring
  labels:
    application: cloudflare
    component: tunnel
spec:
  namespaceSelector:
    matchNames: [cloudflare-operator-system]
  selector: {}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Operator-managed and static tunnel pods use different native labels.
      relabelings:
        - action: keep
          sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_cfargotunnel_com_app
          regex: "cloudflared;.*|.*;cloudflared"
  targetLimit: 5
  sampleLimit: 2000
