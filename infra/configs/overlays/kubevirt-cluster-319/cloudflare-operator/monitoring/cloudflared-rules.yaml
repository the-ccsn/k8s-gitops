apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudflared-tunnel-alerts
  namespace: monitoring
  labels:
    application: cloudflare
    component: tunnel
spec:
  groups:
    - name: cloudflared-tunnel.recording
      interval: 30s
      rules:
        - record: cloudflared:tunnel_ha_connections
          expr: max by (k8s_cluster_name, namespace, pod) (cloudflared_tunnel_ha_connections{namespace="cloudflare-operator-system"})
        - record: cloudflared:tunnel_request_errors:rate5m
          expr: sum by (k8s_cluster_name, namespace, pod) (rate(cloudflared_tunnel_request_errors{namespace="cloudflare-operator-system"}[5m]))
    - name: cloudflared-tunnel.alerts
      rules:
        - alert: CloudflaredTunnelMetricsMissing
          expr: absent(cloudflared_tunnel_ha_connections{namespace="cloudflare-operator-system"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Cloudflared tunnel metrics are missing
            description: No cloudflared Tunnel metrics have reached VictoriaMetrics for ten minutes.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/infra/configs/overlays/kubevirt-cluster-319/cloudflare-operator/monitoring/README.md
        - alert: CloudflaredTunnelDisconnected
          expr: cloudflared:tunnel_ha_connections < 1
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Cloudflared tunnel is disconnected for {{ $labels.namespace }}/{{ $labels.pod }}
            description: The tunnel has reported no active Cloudflare HA connections for three minutes.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/infra/configs/overlays/kubevirt-cluster-319/cloudflare-operator/monitoring/README.md
