apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo.monitoring.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: k8s.cluster.name
            value: k8s_cluster_name
        # A request crosses namespaces and service identities. Match its OTLP
        # trace ID in structured metadata instead of searching the log message.
        customQuery: true
        query: '{${__tags}} | trace_id = "${__span.traceId}"'
        filterByTraceID: false
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: victoriametrics
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: k8s.cluster.name
            value: k8s_cluster_name
          - key: k8s.namespace.name
            value: k8s_namespace_name
          - key: service.name
            value: service
        queries:
          - name: Sampled span rate by kind and status
            query: 'sum by (k8s_namespace_name, job, span_kind, status_code) (rate(traces_spanmetrics_calls_total{${__tags}}[5m]))'
          - name: Sampled span p50 latency (seconds)
            query: 'histogram_quantile(0.5, sum by (le, k8s_namespace_name, job, span_kind) (rate(traces_spanmetrics_latency_bucket{${__tags}}[5m])))'
          - name: Sampled span p95 latency (seconds)
            query: 'histogram_quantile(0.95, sum by (le, k8s_namespace_name, job, span_kind) (rate(traces_spanmetrics_latency_bucket{${__tags}}[5m])))'
      serviceMap:
        datasourceUid: victoriametrics
      nodeGraph:
        enabled: true
      search:
        hide: false
