apiVersion: application.logto.m.crossplane.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-cluster
  namespace: flux-system
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  forProvider:
    name: Kubernetes Cluster
    type: SPA
    description: ''
    isThirdParty: false
    redirectUris:
    - http://localhost:8000
    - http://localhost:18000
    - https://kiali.ccsn.dev
    - https://headlamp.ccsn.dev/oidc-callback
    postLogoutRedirectUris: []
    corsAllowedOrigins: []
    oidcClientMetadataExtra: '{"backchannelLogoutSessionRequired":false}'
    # Temporary compatibility setting for Headlamp's missing prompt=consent.
    # This applies to all applications sharing the Kubernetes OIDC client.
    # Track https://github.com/kubernetes-sigs/headlamp/issues/7558 and
    # https://github.com/kubernetes-sigs/headlamp/pull/7560; disable once the
    # deployed Headlamp sends prompt=consent with offline_access.
    customClientMetadataExtra: '{"idTokenTtl":3600,"refreshTokenTtlInDays":14,"alwaysIssueRefreshToken":true,"rotateRefreshToken":true,"allowTokenExchange":false}'
  writeConnectionSecretToRef:
    name: kubernetes-oidc
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
