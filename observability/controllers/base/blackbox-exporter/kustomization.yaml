apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./config.yaml
  - ./service-account.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./service-monitor.yaml
  - ./probes.yaml
  - ./rules.yaml
  - ./dashboard.yaml
  - ./availability-dashboards.yaml

configMapGenerator:
  - name: blackbox-dashboards
    namespace: grafana
    files:
      - network-availability.json
      - http-availability.json
      - icmp-availability.json
      - dns-availability.json
      - tls-certificates.json
      - network-bandwidth.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
