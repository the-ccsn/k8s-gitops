apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: istio-server-timing
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: istio-server-timing
  template:
    metadata:
      labels:
        app: istio-server-timing
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      initContainers:
      - name: install
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command:
        - sh
        - -eu
        - -c
        args:
        - |
          case "$(uname -m)" in
            x86_64) timing_arch=amd64; timing_digest=49e1d724a195e987be4f887ed0a816db5c82fae7c776ad48dff60d1dbb1d174c ;;
            aarch64) timing_arch=arm64; timing_digest=87d6dbdd647880faf27eac0950695c6b0f85609c5a143351dd8c00a05023d2b7 ;;
            *) echo "Unsupported Envoy plugin architecture" >&2; exit 1 ;;
          esac
          if [ ! -e /runtime/server-timing.so ]; then
            cp "/binaries/server-timing-$timing_arch.so" /runtime/server-timing.next
            printf '%s  %s\n' "$timing_digest" /runtime/server-timing.next | sha256sum -c -
            chmod 0444 /runtime/server-timing.next
            mv /runtime/server-timing.next /runtime/server-timing.so
          fi
          printf '%s  %s\n' "$timing_digest" /runtime/server-timing.so | sha256sum -c -
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id001
            drop:
            - ALL
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: binaries
          mountPath: /binaries
          readOnly: true
        - name: runtime
          mountPath: /runtime
      containers:
      - name: ready
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command:
        - sleep
        - infinity
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id001
          runAsNonRoot: true
          runAsUser: 65534
        resources:
          requests:
            cpu: 1m
            memory: 2Mi
          limits:
            memory: 8Mi
      volumes:
      - name: binaries
        configMap:
          name: istio-server-timing-binaries
      - name: runtime
        hostPath:
          path: /var/lib/istio/server-timing/49e1d724-87d6dbdd
          type: DirectoryOrCreate
