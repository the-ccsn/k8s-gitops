apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: kubernetes-control-plane
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: kubernetes
  json: |-
    {
      "title": "Kubernetes Control Plane",
      "uid": "kubernetes-control-plane",
      "tags": [
        "kubernetes",
        "control-plane"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "API Server Requests",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (code) (rate(apiserver_request_total[5m]))",
              "legendFormat": "HTTP {{code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "API Server Latency p99",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{verb}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Scheduler Attempts",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (result) (rate(scheduler_schedule_attempts_total[5m]))",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Workqueue Depth",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (name) (workqueue_depth)",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
