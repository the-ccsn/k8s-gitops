---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./nginx-config.yaml
  - ./nginx-subconfig.yaml
  - ./cert.yaml
  - ./deployment.yaml
  - ./service.yaml

namespace: i319-reroute

configMapGenerator:
  - name: i319-reroute-server-timing
    files:
      - server-timing-headers.conf
      - server-timing-http.conf
  - name: i319-reroute-server-timing-module
    files:
      - nginx-timing-amd64.so=server-timing-amd64.module
      - nginx-timing-arm64.so=server-timing-arm64.module
