apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: alertmanager
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  json: |-
    {
      "title": "Alertmanager",
      "uid": "alertmanager",
      "tags": [
        "alertmanager",
        "platform"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Alerts",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (state) (alertmanager_alerts)",
              "legendFormat": "{{state}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Notifications",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (integration) (rate(alertmanager_notifications_total[5m]))",
              "legendFormat": "{{integration}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Notification Failures",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (integration) (rate(alertmanager_notifications_failed_total[5m]))",
              "legendFormat": "{{integration}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
