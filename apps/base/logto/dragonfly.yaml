---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: logto-dragonfly
  namespace: prod
spec:
  serviceAccountName: logto-dragonfly
  image: ghcr.io/the-ccsn/dragonfly:v1.40.1-auto-b204b3d41b2c@sha256:73ffbda489e1b16cf2378cad179bc612c1e99a22030d6b0eef0bd604fba9f862
  podMetadata:
    labels:
      app.kubernetes.io/env: prod
  replicas: 1
  args:
    - --maxmemory=1600mb
    - --cache_mode=true
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 10Mi
  authentication:
    passwordFromSecret:
      name: logto-redis-auth
      key: REDIS_PASSWORD
---
# The Operator allows Redis traffic on 6379; ambient transports it over HBONE.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logto-dragonfly-ambient
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: logto-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 15008

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logto-dragonfly
  namespace: prod
automountServiceAccountToken: false
---
# Admit encrypted metrics and native Operator administration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logto-dragonfly-metrics
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: logto-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
          app.kubernetes.io/instance: victoriametrics-vmks
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: dragonfly-operator-system
      podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 15008
---
# Preserve native Operator/peer administration while excluding unrelated workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: logto-dragonfly-admin
  namespace: prod
spec:
  selector:
    matchLabels:
      app: logto-dragonfly
      app.kubernetes.io/name: dragonfly
  action: DENY
  rules:
  - from:
    - source:
        notPrincipals:
        - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
        - cluster.local/ns/dragonfly-operator-system/sa/dragonfly-operator-controller-manager
        - cluster.local/ns/prod/sa/logto-dragonfly
    to:
    - operation:
        ports:
        - '9999'
