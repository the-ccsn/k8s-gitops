apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/i319-reroute/
  - ./dns-binding.yaml

patches:
  - target:
      kind: Certificate
      name: i319-reroute-tls
      namespace: i319-reroute
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: "*.kubevirt-cluster-319.319.ccsn.dev"

  - target:
      kind: Service
      name: i319-reroute
      namespace: i319-reroute
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          networking.ccsn.dev/lb-pool: i319-reroute
      - op: add
        path: /metadata/annotations/networking.ccsn.dev~1dns-scope
        value: campus
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: "ingress.319.ccsn.dev"

  - path: ./nginx-subconfig-infra-patch.yaml
    target:
      kind: ConfigMap
      name: i319-reroute-nginx-subconfig
      namespace: i319-reroute

  # Roll the proxy when the rendered Nginx configuration changes.
  - path: ./deployment-config-patch.yaml
    target:
      kind: Deployment
      name: i319-reroute-proxy
      namespace: i319-reroute
