apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: victoriametrics
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
      to:
        - operation:
            ports: ["8080", "8081"]
    - to:
        - operation:
            notPorts: ["8080", "8081"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: victoria-metrics-operator-metrics
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
      app.kubernetes.io/instance: victoriametrics
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
      to:
        - operation:
            ports: ["8080"]
    # Preserve the separate health and admission webhook listeners.
    - to:
        - operation:
            notPorts: ["8080"]
