# Activate only after the two OMV mTLS frontends pass acceptance.
# See ../portainer/README.md for the certificate and maintenance barriers.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: seaweedfs
  namespace: monitoring
  labels:
    application: seaweedfs
    component: storage
spec:
  jobName: seaweedfs
  scrapeInterval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  scheme: HTTPS
  sampleLimit: 10000
  tlsConfig:
    insecureSkipVerify: false
    ca:
      secret:
        name: seaweedfs-metrics-client-tls
        key: ca.crt
    cert:
      secret:
        name: seaweedfs-metrics-client-tls
        key: tls.crt
    keySecret:
      name: seaweedfs-metrics-client-tls
      key: tls.key
  staticConfigs:
    - targets: [openmediavault.local:9443]
      labels:
        component: master
        __metrics_path__: /master/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: filer
        __metrics_path__: /filer/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: s3-gateway
        __metrics_path__: /s3/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-6a/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-6b/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-12b/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-12a/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-3a/metrics
    - targets: [openmediavault.local:9443]
      labels:
        component: volume-server
        __metrics_path__: /volume-3b/metrics
    - targets: [s3.ccsn.dev:9443]
      labels:
        component: s3-gateway-direct
        __metrics_path__: /s3-direct/metrics
  relabelings:
    # The host has several metrics paths; retain a unique native scrape identity.
    - action: replace
      sourceLabels: [__address__, __metrics_path__]
      separator: ""
      targetLabel: instance
      replacement: $1
    - action: replace
      targetLabel: job
      replacement: seaweedfs
    - action: replace
      targetLabel: node
      replacement: openmediavault-1
    - action: replace
      targetLabel: application
      replacement: seaweedfs
