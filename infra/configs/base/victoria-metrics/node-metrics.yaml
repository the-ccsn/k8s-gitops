apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: kubernetes-nodes
  namespace: monitoring
spec:
  selector:
    {}
  scheme: https
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: false
  relabelConfigs:
    # KubeVirt feature labels exceed VictoriaMetrics' per-series label limit.
    - action: labelmap
      regex: __meta_kubernetes_node_label_(kubernetes_io_(arch|hostname|os)|node_kubernetes_io_instance_type|node_purpose)
      replacement: kubernetes_node_$1
    - source_labels:
        - __meta_kubernetes_node_name
      target_label: node
