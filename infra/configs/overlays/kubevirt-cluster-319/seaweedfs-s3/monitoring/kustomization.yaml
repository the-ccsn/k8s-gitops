apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./metrics-certificates.yaml
  - ./certificate-reader.yaml
  - ./scrape-config.yaml
  - ./rules.yaml
  - ./dashboard.yaml
  - ./availability-probe.yaml
  - ./host-scrape-config.yaml
  - ./host-rules.yaml
  - ./host-dashboard.yaml
  - ./smart-scrape-config.yaml
  - ./smart-rules.yaml
  - ./smart-dashboard.yaml

configMapGenerator:
  - name: seaweedfs-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: omv-host-dashboard
    namespace: grafana
    files:
      - host-dashboard.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: smart-disks-dashboard
    namespace: grafana
    files:
      - smart-dashboard.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
