# iDRAC requires RSA key exchange; avoid its unsupported small-DH cipher suites.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: external-admin-t410-compat
spec:
  priority: 10
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: default-gateway
  configPatches:
    # Cloudflare Tunnel can stream POST bodies using chunked encoding, which
    # this iDRAC rejects. Normalize only its data API, preserving other routes.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.buffer.admin_t410_data
          disabled: true
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
            max_request_bytes: 1048576
    # Explicitly normalize empty bodies too: the buffer filter skips requests
    # whose header decoding already signals end-of-stream.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua.admin_t410_content_length
          disabled: true
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: prod.external-admin-t410.0
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.buffer.admin_t410_data:
              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
              buffer:
                max_request_bytes: 1048576
            envoy.filters.http.lua.admin_t410_content_length:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    local body = handle:body()
                    local headers = handle:headers()
                    headers:remove("transfer-encoding")
                    headers:replace("content-length", tostring(body and body:length() or 0))
                  end
    - applyTo: CLUSTER
      match:
        context: GATEWAY
        cluster:
          service: admin-t410.external-services.mesh.internal
          portNumber: 443
      patch:
        operation: MERGE
        value:
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_params:
                  cipher_suites:
                    - AES128-SHA
