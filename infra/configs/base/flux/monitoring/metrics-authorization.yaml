# Flux resource metrics and controller metrics share port 8080.
# A principal match requires the collector's authenticated Istio mTLS identity.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: flux-metrics
  namespace: flux-system
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/vmagent-victoriametrics-vmks
      to:
        - operation:
            ports: ["8080"]
    - to:
        - operation:
            notPorts: ["8080"]
