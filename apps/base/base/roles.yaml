apiVersion: role.logto.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: base-admin
  namespace: prod
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - LateInitialize
  forProvider:
    name: base:admin
    description: base OpenList native administrator via verified resource access tokens
    type: User
    isDefault: false
    scopeIdsRefs:
    - name: base-domain-admin
      policy:
        resolve: Always
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
