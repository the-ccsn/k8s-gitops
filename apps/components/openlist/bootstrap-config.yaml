apiVersion: v1
kind: ConfigMap
metadata:
  name: openlist-bootstrap
  namespace: prod
data:
  bootstrap.py: "import gzip,json,os,pathlib,sqlite3\nroot=pathlib.Path('/data')\n\
    database=root/'data.db'\nif not database.exists():\n    temporary=root/'data.db.seed'\n\
    \    temporary.write_bytes(gzip.decompress(pathlib.Path('/seed/data.db.gz').read_bytes()))\n\
    \    temporary.chmod(0o600)\n    temporary.replace(database)\nif not (root/'config.json').exists():\n\
    \    (root/'config.json').write_bytes(pathlib.Path('/seed/config.json').read_bytes())\n\
    \    (root/'config.json').chmod(0o600)\nconfig=json.loads((root/'config.json').read_text())\n\
    config['site_url']=os.environ['SITE_URL']\n(root/'config.json').write_text(json.dumps(config)+'\\\
    n')\nnative_mapping=os.environ.get('SSO_OIDC_ROLE_MAPPING','')\nif native_mapping\
    \ and not (root/'data.pre-native-oidc.db').exists():\n    with sqlite3.connect(database)\
    \ as source, sqlite3.connect(root/'data.pre-native-oidc.db') as backup:\n    \
    \    source.backup(backup)\n    (root/'data.pre-native-oidc.db').chmod(0o600)\n\
    settings={\n    'site_url':os.environ['SITE_URL'],\n    'sso_login_enabled':'true','sso_login_platform':'OIDC',\n\
    \    'sso_client_id':pathlib.Path('/oidc/clientId').read_text().strip(),\n   \
    \ 'sso_client_secret':pathlib.Path('/oidc/clientSecret').read_text().strip(),\n\
    \    'sso_endpoint_name':'https://login.ccsn.dev/oidc',\n    'sso_oidc_username_key':'sub','sso_extra_scopes':'email\
    \ roles',\n    'sso_auto_register':os.environ['SSO_AUTO_REGISTER'],\n    'sso_default_dir':'/','sso_default_permission':'65535',\n\
    \    'sso_compatibility_mode':'false'}\nif native_mapping:\n    settings.update(sso_oidc_resource=os.environ['SSO_OIDC_RESOURCE'],sso_oidc_role_mapping=native_mapping,sso_extra_scopes=os.environ['SSO_EXTRA_SCOPES'],sso_oidc_username_mapping=os.environ['SSO_OIDC_USERNAME_MAPPING'])\n\
    connection=sqlite3.connect(database)\nif native_mapping and os.environ.get('OIDC_MIGRATE_SUB_BINDINGS')=='true':\n\
    \    import base64,hashlib\n    assert connection.execute(\"select value from\
    \ x_setting_items where key='sso_oidc_username_key'\").fetchone()[0]=='sub'\n\
    \    for uid,subject in connection.execute(\"select id,sso_id from x_users where\
    \ sso_id!=''\").fetchall():\n        if subject.startswith('oidc:'):\n       \
    \     continue\n        identity='oidc:'+base64.urlsafe_b64encode(hashlib.sha256(json.dumps(['https://login.ccsn.dev/oidc',subject],separators=(',',':')).encode()).digest()).decode().rstrip('=')\n\
    \        connection.execute('update x_users set sso_id=? where id=?',(identity,uid))\n\
    if native_mapping and os.environ.get('OIDC_SPLIT_OWNER_SUBJECT'):\n    subject=os.environ['OIDC_SPLIT_OWNER_SUBJECT']\n\
    \    identity='oidc:'+base64.urlsafe_b64encode(hashlib.sha256(json.dumps(['https://login.ccsn.dev/oidc',subject],separators=(',',':')).encode()).digest()).decode().rstrip('=')\n\
    \    columns=[row[1] for row in connection.execute('pragma table_info(x_users)')]\n\
    \    bound=connection.execute('select * from x_users where sso_id=?',(identity,)).fetchall()\n\
    \    assert len(bound)<=1, 'Ambiguous owner identity binding'\n    if bound:\n\
    \        account=dict(zip(columns,bound[0]))\n        username='oidc:'+subject\n\
    \        collision=connection.execute('select id from x_users where username=?',(username,)).fetchone()\n\
    \        assert not collision or collision[0]==account['id'], 'Owner username\
    \ is already occupied'\n        if account['username']=='admin':\n           \
    \ connection.execute(\"update x_users set sso_id='' where id=?\",(account['id'],))\n\
    \            account.pop('id')\n            account.update(username=username,role=0,sso_id=identity)\n\
    \            keys=list(account)\n            connection.execute('insert into x_users\
    \ ('+','.join('\"'+key+'\"' for key in keys)+') values ('+','.join('?' for _ in\
    \ keys)+')',[account[key] for key in keys])\n        elif account['username']==subject:\n\
    \            connection.execute('update x_users set username=? where id=?',(username,account['id']))\n\
    for key,value in settings.items():\n    result=connection.execute('update x_setting_items\
    \ set value=? where key=?',(value,key))\n    if not result.rowcount:\n       \
    \ connection.execute('insert into x_setting_items (key,value,type,\"group\",flag,\"\
    index\") values (?,?,?,7,1,0)',(key,value,'string'))\nfor row in connection.execute(\"\
    select id,driver,addition from x_storages\").fetchall():\n    storage_id,driver,raw=row\n\
    \    if driver!='S3':\n        continue\n    addition=json.loads(raw)\n    if\
    \ addition.get('bucket') not in ['buctbase','share'] or addition.get('endpoint')\
    \ not in ['https://s3.ccsn.dev','http://192.168.1.22:8333']:\n        continue\n\
    \    addition.update(endpoint='http://192.168.1.22:8333',custom_host='https://s3.ccsn.dev',enable_custom_host_presign=True)\n\
    \    connection.execute('update x_storages set addition=? where id=?',(json.dumps(addition),storage_id))\n\
    assert connection.execute('pragma integrity_check').fetchone()[0]=='ok'\nconnection.commit()\n\
    connection.close()\nprint('Copied migration state if needed and configured native\
    \ OIDC without exposing credentials.')\n"
