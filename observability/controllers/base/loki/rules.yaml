apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-health
  namespace: monitoring
  labels:
    application: loki
    component: logging
spec:
  groups:
    - name: loki-health
      rules:
        - alert: LokiDiscardingLogs
          expr: sum by (k8s_cluster_name, namespace, reason) (rate(loki_discarded_samples_total[5m])) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Loki is discarding log records
            description: Check ingestion limits, retention, storage errors, and the discard reason label.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/telemetry-pipeline.md
        - alert: LokiWalDiskFull
          expr: increase(loki_ingester_wal_disk_full_failures_total[5m]) > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "Loki {{ $labels.pod }} cannot write its WAL because the disk is full"
            description: Loki may continue accepting data without a durable WAL record. Restore local disk headroom and inspect ingestion and recovery health.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/controllers/base/loki/README.md
        - alert: LokiRuleEvaluationErrors
          expr: sum by (k8s_cluster_name, namespace, rule_group) (rate(loki_prometheus_rule_evaluation_failures_total[5m])) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Loki log-alert evaluations are failing
            description: Inspect the affected rule group and query errors; missing log alerts are not evidence of healthy applications.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/controllers/base/loki/README.md
        - alert: LokiMetricsMissing
          expr: absent(up{namespace="monitoring",job="monitoring/loki-single-binary"})
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: Loki backend scrape targets have disappeared
            description: Check Loki workload and monitor discovery. Generic target-down alerts only cover targets still present in service discovery.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/controllers/base/loki/README.md
        - alert: LokiChunkFlushFailures
          expr: sum by (k8s_cluster_name, namespace, pod) (rate(loki_ingester_chunks_flush_failures_total[5m])) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Loki cannot flush chunks reliably
            description: Check S3 credentials, permissions, connectivity and capacity. WAL buffering can temporarily hide backend failure from ingestion health.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/controllers/base/loki/README.md
        - alert: LokiS3PutLatencyHigh
          expr: >-
            (sum by (k8s_cluster_name, namespace, pod)
            (rate(loki_s3_request_duration_seconds_sum{namespace="monitoring",operation="S3.PutObject",status_code=~"2.."}[5m]))
            / sum by (k8s_cluster_name, namespace, pod)
            (rate(loki_s3_request_duration_seconds_count{namespace="monitoring",operation="S3.PutObject",status_code=~"2.."}[5m]))
            > 2) and on (k8s_cluster_name, namespace, pod) (sum by (k8s_cluster_name, namespace, pod)
            (increase(loki_s3_request_duration_seconds_count{namespace="monitoring",operation="S3.PutObject",status_code=~"2.."}[5m]))
            >= 3)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: 'Loki mean S3 PUT latency exceeds two seconds: {{ $labels.namespace }}/{{ $labels.pod }}'
            description: At least three successful PUTs per five-minute window are required. Inspect OMV memory pressure, FUSE/background I/O and HDD contention on the configured S3 path.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#seaweedfs
        - alert: LokiQueryErrors
          expr: >-
            (sum by (k8s_cluster_name, namespace, route)
            (rate(loki_request_duration_seconds_count{namespace="monitoring",route=~".*(quer|search|trace|tag|label|series).*",status_code=~"5.."}[5m]))
            / sum by (k8s_cluster_name, namespace, route)
            (rate(loki_request_duration_seconds_count{namespace="monitoring",route=~".*(quer|search|trace|tag|label|series).*"}[5m]))
            > 0.05) and on (k8s_cluster_name, namespace, route) (sum by (k8s_cluster_name, namespace, route)
            (increase(loki_request_duration_seconds_count{namespace="monitoring",route=~".*(quer|search|trace|tag|label|series).*",status_code=~"5.."}[5m]))
            >= 3)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Loki query server errors exceed 5%: {{ $labels.namespace }}/{{ $labels.route }}'
            description: At least three server errors per five-minute window are required. Inspect request errors, query queues and object storage.
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#telemetry
        - alert: LokiQueryLatencyHigh
          expr: >-
            histogram_quantile(0.95, sum by (k8s_cluster_name, namespace, route, le)
            (rate(loki_request_duration_seconds_bucket{namespace="monitoring",route=~".*(quer|search|trace|tag|label|series).*"}[5m])))
            > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Loki p95 query latency exceeds ten seconds: {{ $labels.namespace }}/{{ $labels.route }}'
            description: Loki p95 query latency exceeds ten seconds
            runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/observability/alerts.md#telemetry
