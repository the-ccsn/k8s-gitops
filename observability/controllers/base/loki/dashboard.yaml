apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: application-logs
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: logging
  json: |-
    {
      "title": "Application Logs",
      "uid": "application-logs",
      "tags": ["loki", "logs", "applications"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {"name": "namespace", "label": "Namespace", "type": "query", "datasource": {"type": "loki", "uid": "loki"}, "query": "label_values(namespace)", "includeAll": true, "allValue": ".+"},
          {"name": "app", "label": "Application", "type": "query", "datasource": {"type": "loki", "uid": "loki"}, "query": "label_values({namespace=~\"$namespace\"}, app)", "includeAll": true, "allValue": ".+"}
        ]
      },
      "panels": [
        {
          "id": 1, "title": "Log Volume", "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (level) (count_over_time({namespace=~\"$namespace\",app=~\"$app\"}[5m]))", "legendFormat": "{{level}}", "refId": "A"}]
        },
        {
          "id": 2, "title": "Logs", "type": "logs",
          "gridPos": {"h": 14, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=~\"$namespace\",app=~\"$app\"}", "refId": "A"}]
        }
      ]
    }
