apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./metrics-certificates.yaml
  - ./certificate-reader.yaml
  - ./scrape-config.yaml
  - ./rules.yaml
  - ./dashboard.yaml
  - ./availability-probe.yaml

configMapGenerator:
  - name: seaweedfs-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
