apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-admin-r730
spec:
  exportTo: ["."]
  hosts:
    - admin-r730.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 80
      name: http-admin-r730
      protocol: HTTP
  resolution: STATIC
  endpoints:
    - address: 192.168.1.92
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-admin-r730
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - admin-r730.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: admin-r730.external-services.mesh.internal
          port: 80
