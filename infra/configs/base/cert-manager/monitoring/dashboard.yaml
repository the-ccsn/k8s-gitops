apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cert-manager
  namespace: grafana
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    observability.ccsn.dev/upstream-url: https://raw.githubusercontent.com/monitoring-mixins/website/7b1f6de899ffdbdf59c807a32cd8a9a514231915/assets/cert-manager/dashboards/cert-manager-overview.json
    observability.ccsn.dev/upstream-sha256: 733b08670ce7c93d6ea9efcc04c1c0a86bdd53ad2ceaf33d414200886916d582
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  configMapRef:
    name: cert-manager-dashboard
    key: dashboard.json
