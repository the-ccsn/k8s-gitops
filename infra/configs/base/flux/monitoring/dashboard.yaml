apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: flux
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  json: |-
    {
      "title": "Flux GitOps",
      "uid": "flux",
      "tags": [
        "flux",
        "gitops"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Ready Resources",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(flux_resource_info{ready=\"True\",suspended=\"False\"})",
              "legendFormat": "Ready",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Not Ready Resources",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(flux_resource_info{ready!=\"True\",suspended=\"False\"}) or vector(0)",
              "legendFormat": "Not ready",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Reconcile Duration p95",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, kind) (rate(gotk_reconcile_duration_seconds_bucket[5m])))",
              "legendFormat": "{{kind}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Not Ready by Kind",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (kind) (flux_resource_info{ready!=\"True\",suspended=\"False\"})",
              "legendFormat": "{{kind}}",
              "refId": "A"
            }
          ]
        }
      ],
      "description": "Resource readiness from Flux Operator; reconcile latency from the four Flux controllers."
    }
