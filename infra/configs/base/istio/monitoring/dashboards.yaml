apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: gateway-api
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: networking
  json: |-
    {
      "title": "Gateway API",
      "uid": "gateway-api",
      "tags": [
        "gateway-api",
        "networking"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (response_code) (rate(istio_requests_total{gateway_name!=\"\",reporter=~\"source|waypoint\"}[5m]))",
              "legendFormat": "HTTP {{response_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{gateway_name!=\"\",reporter=~\"source|waypoint\",response_code=~\"5..\"}[5m])) / sum(rate(istio_requests_total{gateway_name!=\"\",reporter=~\"source|waypoint\"}[5m]))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p99",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{gateway_name!=\"\",reporter=~\"source|waypoint\"}[5m])))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Metrics endpoints up",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(up{gateway_name!=\"\"})",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: istio-mesh
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: networking
  json: |-
    {
      "title": "Istio Service Mesh",
      "uid": "istio-mesh",
      "tags": [
        "istio",
        "mesh"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [{
          "name": "namespace",
          "label": "Destination namespace",
          "type": "query",
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "query": "label_values({__name__=~\"istio_requests_total|istio_tcp_connections_opened_total\"}, destination_workload_namespace)",
          "refresh": 1,
          "includeAll": true,
          "allValue": ".*",
          "multi": true,
          "current": {"selected": true, "text": "All", "value": "$__all"}
        }]
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (destination_service_name) (rate(istio_requests_total{reporter=~\"source|waypoint\",destination_workload_namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{destination_service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "5xx",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (destination_service_name) (rate(istio_requests_total{reporter=~\"source|waypoint\",destination_workload_namespace=~\"$namespace\",response_code=~\"5..\"}[5m]))",
              "legendFormat": "{{destination_service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p95",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\",destination_workload_namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "{{destination_service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "TCP Connections",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum by (destination_service_name) (istio_tcp_connections_opened_total{reporter=~\"source|waypoint\",destination_workload_namespace=~\"$namespace\"} - istio_tcp_connections_closed_total{reporter=~\"source|waypoint\",destination_workload_namespace=~\"$namespace\"})",
              "legendFormat": "{{destination_service_name}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
