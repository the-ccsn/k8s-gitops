# https://github.com/cilium/cilium/tree/v1.19.0/install/kubernetes/cilium
enableIPv4Masquerade: true

# ======================== Tuning Cilium ========================
# https://docs.cilium.io/en/stable/operations/performance/tuning/
# https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
kubeProxyReplacement: true

k8s:
  # https://github.com/cilium/cilium/pull/37601
  apiServerURLs: https://192.168.1.163:6443

devices: ovsbr+

extraConfig:
  # Nix declares snat0 with only the node IPv4 and usable public IPv6 address.
  # Avoid selecting kube-vip Service VIPs from the multi-address ovsbr1 device.
  # https://github.com/cilium/cilium/issues/38376 (stale-closed, not fixed)
  # https://github.com/cilium/cilium/issues/17158 (routing-based selection)
  derive-masq-ip-addr-from-device: snat0

# Requires NIC/OVS/IPv6 MTU 9000 on every host before recreating agents.
# Existing Pod interfaces retain their old MTU until the Pod is recreated.
MTU: 9000

pmtuDiscovery:
  # Return ICMP errors for oversized DSR service requests.
  # Keep Pod blackhole probing for other paths with smaller MTUs.
  enabled: true
  packetizationLayerPMTUDMode: blackhole

bpf:
  # Use l2 insead l3 for KubeVirt compatability https://github.com/cilium/cilium/issues/37265#issuecomment-2626483413
  datapathMode: netkit-l2
  # Requires the nix-config loopback address 169.254.7.127/32 on every node.
  # Keep Ambient kubelet probe replies local when bypassing the host stack.
  # https://github.com/cilium/cilium/issues/36022
  # https://github.com/istio/istio/issues/52208
  # Rollout requires the snat0 address source above on every node.
  masquerade: true
  hostLegacyRouting: false
  # Reduce periodic trace events for long-lived connections.
  monitorInterval: 10s
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.08

routingMode: native
autoDirectNodeRoutes: true

# Match Cilium's allocated cluster-pool Pod CIDRs, not the K3s Node PodCIDRs.
ipv4NativeRoutingCIDR: 10.0.0.0/8
ipv6NativeRoutingCIDR: fd00::/104
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: [10.0.0.0/8]
    clusterPoolIPv6PodCIDRList: [fd00::/104]

updateStrategy:
  # Gate this migration on endpoint, Ambient/non-Ambient traffic and probe checks.
  # Recreate agents one node at a time using the Pod Eviction API, then restore
  # RollingUpdate with maxUnavailable=1 after all three nodes are verified.
  type: OnDelete
  rollingUpdate: null

bandwidthManager:
  enabled: true
  bbr: true

loadBalancer:
  mode: dsr
  acceleration: best-effort # XDP acceleration

bpfClockProbe: true

# ======================== Work with Istio ========================
# https://docs.cilium.io/en/latest/network/servicemesh/istio/
cni:
  exclusive: false
socketLB:
  hostNamespaceOnly: true
# disable L7 Proxy
l7Proxy: false

# ============================  Dual Stack  ============================
ipv6:
  enabled: true
# -- Enables masquerading of IPv6 traffic leaving the node from endpoints.
enableIPv6Masquerade: true

# ============================  L2 Announcements  ============================
# https://docs.cilium.io/en/stable/network/l2-announcements/
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 100
  burst: 200

# ============================  BGP Control Plane  ============================
# https://docs.cilium.io/en/stable/network/bgp-control-plane/
bgpControlPlane:
  enabled: true

operator:
  replicas: 1 # For now that I have only 1 node

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
