apiVersion: v1
kind: ServiceAccount
metadata:
  name: omv-s3-cert-reader
  namespace: prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omv-s3-cert-reader
  namespace: prod
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [omv-seaweedfs-s3-campus-tls]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omv-s3-cert-reader
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omv-s3-cert-reader
subjects:
  - kind: ServiceAccount
    name: omv-s3-cert-reader
    namespace: prod
---
apiVersion: v1
kind: Secret
metadata:
  name: omv-s3-cert-reader-token
  namespace: prod
  annotations:
    kubernetes.io/service-account.name: omv-s3-cert-reader
type: kubernetes.io/service-account-token
