---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:

  # Keep one steady-state instance; rolling updates briefly overlap two instances.
  # PostgreSQL and the migrated RWX data volume are shared during that overlap.
  # WebSocket notifications are process-local and may need a client reconnect.
  # See README.md for the mandatory data migration before rollout.

  releaseName: vaultwarden
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: helm-chart-vaultwarden
    namespace: prod
  values:
    # HTTPS required for Passkey support
    domain: 'https://vault.ccsn.dev'

    vaultwarden:
      signupsAllowed: false
      signupsVerify: true
      invitationsAllowed: true
      sendsAllowed: true
      passwordIterations: 600000
      proxy:
        ipHeader: X-Envoy-External-Address

    admin:
      existingSecret: vaultwarden-admin
      existingSecretTokenKey: admin-token

    smtp:
      enabled: true
      host: smtp.office365.com
      port: 587
      from: noreply@ccsn.dev
      fromName: Vaultwarden
      security: starttls
      username: noreply@ccsn.dev
      existingSecret: vaultwarden-smtp
      existingSecretPasswordKey: password

    database:
      mode: external
      external:
        vendor: postgres
        existingSecret: vaultwarden-pg-cluster-app
        existingSecretUrlKey: uri

    extraEnv:
      - name: PUSH_ENABLED
        value: "true"
      - name: PUSH_INSTALLATION_ID
        valueFrom:
          secretKeyRef:
            name: vaultwarden-push
            key: PUSH_INSTALLATION_ID
      - name: PUSH_INSTALLATION_KEY
        valueFrom:
          secretKeyRef:
            name: vaultwarden-push
            key: PUSH_INSTALLATION_KEY
      - name: SSO_ENABLED
        value: "true"
      - name: SSO_SIGNUPS_MATCH_EMAIL # On SSO Signup if a user with a matching email already exists make the association (default true)
        value: "true"
      - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION # Allow unknown email verification status (default false). Allowing this with SSO_SIGNUPS_MATCH_EMAIL open potential account takeover.
        value: "false"
      - name: SSO_AUTHORITY
        value: "https://login.ccsn.dev/oidc"
      - name: SSO_SCOPES
        value: "openid email profile offline_access"
      - name: SSO_CLIENT_ID
        value: "1a2zc0uue83n20iy87u5a"
      - name: SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: vaultwarden-oidc
            key: SSO_CLIENT_SECRET

    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

    data:
      persistence:
        enabled: true
        size: 5Gi
        # Keep the chart-managed RWO claim for rollback; only the Deployment moves.
        annotations:
          helm.sh/resource-policy: keep

  # The pinned chart has no strategy setting. Keep its old PVC in the release.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: vaultwarden-vaultwarden
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vaultwarden-vaultwarden
              spec:
                replicas: 1
                minReadySeconds: 10
                strategy:
                  type: RollingUpdate
                template:
                  spec:
                    initContainers:
                      - name: verify-rwx-migration
                        image: docker.io/library/python:3.14-alpine@sha256:dd4d2bd5b53d9b25a51da13addf2be586beebd5387e289e798e4083d94ca837a
                        command:
                          - /bin/sh
                          - -ec
                          - |
                            test -f /data/.rwx-migration-complete
                            test -s /data/rsa_key.pem
                            test -s /data/rsa_key.pub.pem
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: [ALL]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        volumeMounts:
                          - name: data
                            mountPath: /data
                            readOnly: true
                    containers:
                      - name: vaultwarden
                        lifecycle:
                          preStop:
                            exec:
                              command: [/bin/sh, -ec, "sleep 10"]
                    volumes:
                      - name: data
                        persistentVolumeClaim:
                          claimName: vaultwarden-vaultwarden-data-rwx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-vaultwarden-data-rwx
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-backup
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
