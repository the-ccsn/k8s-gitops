apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-admin
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: default-gateway
      ports:
        - port: 23646
          protocol: TCP
    # Ambient carries authenticated traffic over HBONE; the workload policy
    # restricts its source identity and destination port after decapsulation.
    - ports:
        - port: 15008
          protocol: TCP
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: seaweedfs-admin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-admin
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: seaweedfs-admin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-admin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/prod/sa/default-gateway-istio
      to:
        - operation:
            ports: ['23646']
