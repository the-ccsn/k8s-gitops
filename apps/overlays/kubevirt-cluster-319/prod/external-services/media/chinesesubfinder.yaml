apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-chinesesubfinder
spec:
  exportTo: ["."]
  hosts:
    - chinesesubfinder.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 19035
      name: http-chinesesubfinder
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-chinesesubfinder
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - chinesesubfinder.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: chinesesubfinder.external-services.mesh.internal
          port: 19035
