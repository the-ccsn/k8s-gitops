apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
data:
  blackbox.yml: |-
    modules:
      internal_http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
      internal_dns_a:
        prober: dns
        timeout: 5s
        dns:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
          transport_protocol: udp
          query_name: kubernetes.default.svc.cluster.local
          query_type: A
          valid_rcodes:
          - NOERROR
      campus_dns_a:
        prober: dns
        timeout: 5s
        dns:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          transport_protocol: udp
          query_name: buct.edu.cn
          query_type: A
          valid_rcodes:
          - NOERROR
