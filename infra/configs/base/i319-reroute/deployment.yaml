apiVersion: apps/v1
kind: Deployment
metadata:
  name: i319-reroute-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i319-reroute-proxy
  template:
    metadata:
      labels:
        app: i319-reroute-proxy
    spec:
      containers:
      - name: nginx
        # Use mainline for guaranteed QUIC and HTTP/2 support
        image: nginx:mainline-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
        ports:
        # Expose HTTP TCP port
        - containerPort: 80
          protocol: TCP
        # Expose HTTPS TCP port for HTTP/1.1 and HTTP/2
        - containerPort: 443
          protocol: TCP
        # Expose HTTPS UDP port for QUIC
        - containerPort: 443
          protocol: UDP
        resources:
          requests:
            cpu: "500m"
            memory: "100Mi"
          limits:
            cpu: "2"
            memory: "256Mi"
        volumeMounts:
        - name: server-timing
          mountPath: /etc/nginx/server-timing
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-subconfig
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        - name: server-timing-module
          mountPath: /etc/nginx/native-modules
          readOnly: true
      volumes:
      - name: server-timing
        configMap:
          name: i319-reroute-server-timing
      - name: nginx-config
        configMap:
          name: i319-reroute-nginx-config
      - name: nginx-subconfig
        configMap:
          name: i319-reroute-nginx-subconfig
      - name: tls-certs
        secret:
          secretName: i319-reroute-tls-secret
      - name: server-timing-binaries
        configMap:
          name: i319-reroute-server-timing-module
      - name: server-timing-module
        emptyDir: {}
      initContainers:
      - name: server-timing-module
        image: nginx:mainline-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
        command:
        - sh
        - -eu
        - -c
        args:
        - |
          case "$(uname -m)" in
            x86_64) timing_arch=amd64 ;;
            aarch64) timing_arch=arm64 ;;
            *) echo "Unsupported Nginx module architecture" >&2; exit 1 ;;
          esac
          cp "/binaries/nginx-timing-$timing_arch.so" /selected/ngx_http_ccsn_server_timing_module.so
        volumeMounts:
        - name: server-timing-binaries
          mountPath: /binaries
          readOnly: true
        - name: server-timing-module
          mountPath: /selected
