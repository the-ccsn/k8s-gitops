apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # Keep Pod traffic on the existing S3 LAN endpoint, including ambient clients.
  s3.server: |
    s3.ccsn.dev:53 s3.319.ccsn.dev:53 {
        errors
        cache 60
        forward . 172.17.119.91
    }
  local.override: |
    forward local 192.168.1.1 {
        except cluster.local
    }
