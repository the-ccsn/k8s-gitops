load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
  # Disable routine access logs. Only the fixed query backend is contacted.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1k;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 8k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 15s;
  keepalive_timeout 5s;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s;
  resolver_timeout 3s;
  js_import metrics from /etc/headlamp-metrics/query-proxy.js;
  js_fetch_timeout 15s;
  js_fetch_max_response_buffer_size 8m;

  # Bound the number of simultaneously buffered query responses for this pod.
  limit_conn_zone $server_name zone=metrics_queries:1m;
  limit_conn_status 429;

  server {
    listen 8080;
    server_name headlamp-metrics;
    limit_conn metrics_queries 4;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Reject request bodies before js_content reads them, including chunked GETs.
    if ($content_length !~ "^(0)?$") { return 413; }
    if ($http_transfer_encoding != "") { return 413; }

    location / {
      default_type application/json;
      js_content metrics.query;
    }
  }
}
