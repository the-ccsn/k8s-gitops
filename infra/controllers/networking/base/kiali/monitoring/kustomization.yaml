apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-tracing/
  - ./pod-monitor.yaml
  - ./metrics-authorization.yaml
  - ./metrics-network-policy.yaml
  - ./dashboard.yaml

configMapGenerator:
  - name: kiali-dashboard
    namespace: grafana
    files:
      - dashboard.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
