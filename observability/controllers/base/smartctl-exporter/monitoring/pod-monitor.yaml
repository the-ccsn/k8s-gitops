apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: smartctl-exporter
  labels:
    application: smartctl-exporter
    component: host
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  sampleLimit: 5000
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
      honorLabels: false
      relabelings:
        - action: replace
          targetLabel: job
          replacement: smartctl
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - action: replace
          targetLabel: application
          replacement: smartctl-exporter
