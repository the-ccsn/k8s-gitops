apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: harbor-maintainers
  namespace: harbor
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  forProvider:
    groupName: harbor:maintainer
    groupType: 3 # OIDC
  providerConfigRef:
    name: ccsn-harbor
    kind: ProviderConfig
---
apiVersion: project.harbor.m.crossplane.io/v1alpha1
kind: MemberGroup
metadata:
  name: dockerhub-maintainers
  namespace: harbor
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  forProvider:
    projectIdRef:
      name: dockerhub
      policy:
        resolve: Always
    type: oidc
    groupName: harbor:maintainer
    role: maintainer
  providerConfigRef:
    name: ccsn-harbor
    kind: ProviderConfig
---
