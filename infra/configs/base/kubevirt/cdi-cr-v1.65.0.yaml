apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
    - HonorWaitForFirstConsumer
    - WebhookPvcRendering
    podResourceRequirements:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '2'
        memory: 2Gi
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
  workload:
    nodeSelector:
      kubernetes.io/os: linux
  customizeComponents:
    patches:
    - resourceType: Deployment
      resourceName: cdi-apiserver
      type: strategic
      patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-apiserver","resources":{"requests":{"cpu":"100m","memory":"150Mi"},"limits":{"cpu":"1","memory":"512Mi"}}}]}}}}'
    - resourceType: Deployment
      resourceName: cdi-deployment
      type: strategic
      patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-deployment","resources":{"requests":{"cpu":"100m","memory":"150Mi"},"limits":{"cpu":"1","memory":"512Mi"}}}]}}}}'
    - resourceType: Deployment
      resourceName: cdi-uploadproxy
      type: strategic
      patch: '{"spec":{"template":{"spec":{"containers":[{"name":"cdi-uploadproxy","resources":{"requests":{"cpu":"100m","memory":"150Mi"},"limits":{"cpu":"500m","memory":"256Mi"}}}]}}}}'
