apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-base
spec:
  exportTo:
  - .
  hosts:
  - base.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
  - number: 5246
    name: http-base
    protocol: HTTP
  resolution: DNS
  endpoints:
  - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-base
spec:
  parentRefs:
  - name: default-gateway
  hostnames:
  - base.ccsn.dev
  rules:
  - timeouts:
      request: 0s
    backendRefs:
    - group: ''
      kind: Service
      name: base
      port: 5244
