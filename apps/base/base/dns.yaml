apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: base
spec:
  endpoints:
  - dnsName: base.ccsn.dev
    recordType: CNAME
    recordTTL: 1
    targets:
    - prod.ingress.ccsn.dev
    providerSpecific:
    - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
      value: 'true'
