apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-jellyseerr
spec:
  exportTo: ["."]
  hosts:
    - jellyseerr.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 15055
      name: http-jellyseerr
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-jellyseerr
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - jellyseerr.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: jellyseerr.external-services.mesh.internal
          port: 15055
