# Backend Services opt in individually with istio.io/use-waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: observability-waypoint
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
