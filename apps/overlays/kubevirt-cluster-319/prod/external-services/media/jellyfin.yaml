apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-jellyfin
spec:
  exportTo: ["."]
  hosts:
    - jellyfin.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 8096
      name: http-jellyfin
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-jellyfin
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - jellyfin.ccsn.dev
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: jellyfin.external-services.mesh.internal
          port: 8096
