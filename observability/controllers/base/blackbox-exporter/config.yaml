apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
data:
  blackbox.yml: |-
    modules:
      internal_http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
      internal_dns_a:
        prober: dns
        timeout: 5s
        dns:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
          transport_protocol: udp
          query_name: kubernetes.default.svc.cluster.local
          query_type: A
          valid_rcodes:
          - NOERROR
      campus_dns_a:
        prober: dns
        timeout: 5s
        dns:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          transport_protocol: udp
          query_name: buct.edu.cn
          query_type: A
          valid_rcodes:
          - NOERROR
      # Private S3 roots may return 403; this checks transport and TLS only.
      internal_s3_https:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200, 403]
          fail_if_not_ssl: true
          follow_redirects: false
          preferred_ip_protocol: ip6
          ip_protocol_fallback: true
          tls_config:
            insecure_skip_verify: false
