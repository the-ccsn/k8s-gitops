apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-application-log-rules
  namespace: monitoring
  labels:
    loki_rule: "1"
    application: loki
    component: logging
data:
  application-logs.yaml: |-
    groups:
      - name: application-logs-critical
        rules:
          - alert: ApplicationCriticalLogs
            expr: |
              sum by (app, namespace, container) (
                rate({namespace=~".+"} | severity_text=~"(?i:error|critical|fatal)" [5m])
              ) > 0
            for: 1m
            labels:
              severity: critical
              component: logging
            annotations:
              summary: "Critical logs from {{ $labels.app }}/{{ $labels.namespace }}"
              description: "Container {{ $labels.container }} is producing critical-level logs."
              runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/application-logs.md
          - alert: ApplicationHighErrorLogs
            expr: |
              sum by (app, namespace) (
                rate({namespace=~".+"} | severity_text=~"(?i:error|err)" [5m])
              ) > 10
            for: 5m
            labels:
              severity: warning
              component: logging
            annotations:
              summary: "High error rate from {{ $labels.app }}"
              description: "Error log rate is above 10/s for {{ $labels.app }}/{{ $labels.namespace }}."
              runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/application-logs.md
      - name: application-logs-info
        rules:
          - alert: ApplicationPanicLogs
            expr: |
              sum by (app, namespace) (
                rate({namespace=~".+"} |~ "(?i)panic" [5m])
              ) > 0
            for: 30s
            labels:
              severity: critical
              component: logging
            annotations:
              summary: "Panic detected in {{ $labels.app }}"
              description: "Application {{ $labels.app }}/{{ $labels.namespace }} is producing panic logs."
              runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/application-logs.md
          - alert: ApplicationWarningLogs
            expr: |
              sum by (app, namespace) (
                rate({namespace=~".+"} | severity_text=~"(?i:warn|warning)" [5m])
              ) > 50
            for: 10m
            labels:
              severity: info
              component: logging
            annotations:
              summary: "High warning rate from {{ $labels.app }}"
              description: "Warning log rate is above 50/s for {{ $labels.app }}/{{ $labels.namespace }}."
              runbook_url: https://github.com/the-ccsn/k8s-gitops/blob/main/docs/troubleshooting/runbooks/application-logs.md
