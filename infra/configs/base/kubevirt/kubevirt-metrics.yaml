# https://kubevirt.io/user-guide/user_workloads/component_monitoring/
#
# Scrape metrics from this service:
#   kubectl get svc -n kubevirt kubevirt-prometheus-metrics -oyaml
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kubevirt-prometheus-metrics
  namespace: kubevirt
spec:
  jobLabel: kubevirt
  targetLabels: [app]
  selector:
    matchLabels:
      prometheus.kubevirt.io: "true"
  namespaceSelector:
    matchNames:
      - kubevirt
  # Components use separate certificates signed by the rotating KubeVirt CA.
  endpoints:
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: false
        serverName: virt-exportproxy.kubevirt.svc
        ca:
          configMap:
            name: kubevirt-ca
            key: ca-bundle
      relabelConfigs:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_kubevirt_io]
          regex: virt-exportproxy
      metricRelabelConfigs:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: kubevirt_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
      interval: 15s
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: false
        serverName: virt-api.kubevirt.svc
        ca:
          configMap:
            name: kubevirt-ca
            key: ca-bundle
      relabelConfigs:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_kubevirt_io]
          regex: virt-api
      metricRelabelConfigs:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: kubevirt_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
      interval: 15s
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: false
        serverName: virt-controller.kubevirt.svc
        ca:
          configMap:
            name: kubevirt-ca
            key: ca-bundle
      relabelConfigs:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_kubevirt_io]
          regex: virt-controller
      metricRelabelConfigs:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: kubevirt_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
      interval: 15s
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: false
        serverName: virt-handler.kubevirt.svc
        ca:
          configMap:
            name: kubevirt-ca
            key: ca-bundle
      relabelConfigs:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_kubevirt_io]
          regex: virt-handler
      metricRelabelConfigs:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: kubevirt_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
      interval: 15s
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: false
        serverName: kubevirt-operator-webhook.kubevirt.svc
        ca:
          configMap:
            name: kubevirt-ca
            key: ca-bundle
      relabelConfigs:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_kubevirt_io]
          regex: virt-operator
      metricRelabelConfigs:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: kubevirt_resource_namespace_name
        - action: labeldrop
          regex: exported_namespace
      interval: 15s
