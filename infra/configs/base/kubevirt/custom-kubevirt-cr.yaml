---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/os: linux
        node-purpose: kubevirt
  certificateRotateStrategy: {}
  configuration:
    network:
      # Bridge network interface on Pod network
      # is not compatible with istio & live migration
      # so we should disable it
      permitBridgeInterfaceOnPodNetwork: false
    migrations:
      parallelMigrationsPerCluster: 5
      parallelOutboundMigrationsPerNode: 2
      bandwidthPerMigration: 220Mi # 220MiB/s
      completionTimeoutPerGiB: 800
      progressTimeout: 150
      disableTLS: false
      nodeDrainTaintKey: "kubevirt.io/drain"
      allowAutoConverge: false
      allowPostCopy: false
      unsafeMigrationOverride: false
    developerConfiguration:
      # https://kubevirt.io/user-guide/compute/node_overcommit/#node-cpu-allocation-ratio
      cpuAllocationRatio: 10 # 1vcpu = 1/10 cpu core
      # Checked against KubeVirt v1.8.1 pkg/virt-config/featuregate/{active,inactive}.go.
      # Persistent state, live migration and CPU/memory hotplug are already GA.
      featureGates:
        - Snapshot
        - VMExport
        - CPUManager
        - ExpandDisks
        - HypervStrictCheck
        - HostDevices
        # Prefer declarative volume updates over deprecated HotplugVolumes.
        - DeclarativeHotplugVolumes
        - EnableVirtioFsStorageVolumes
        # Desktop display selection and guest crash/reboot handling.
        - VideoConfig
        - PanicDevices
        - RebootPolicy
        # Diagnose resource use and dependencies; prioritize node maintenance.
        - ObjectGraph
        - VmiMemoryOverheadReport
        - MigrationPriorityQueue
        # Kubernetes 1.35 provides the required node-bound service account tokens.
        - NodeRestriction
    vmStateStorageClass: longhorn-vm-state
    vmRolloutStrategy: LiveUpdate
    permittedHostDevices:
      # https://kubevirt.io/user-guide/compute/host-devices/#exposing-usb-devices
      usb:
        # To get the vendor and product ID of the USB device,
        # run the following command on the host machine:
        #   lsusb -vvv | egrep -2 'Vendor|Product'
        - resourceName: kubevirt.io/usb-storage-unitek
          selectors:
            - vendor: "152d" # JMicron Technology Corp. / JMicron USA Technology Corp.
              product: "0567" # JMS567 SATA 6Gb/s bridge
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    # live migration is preferred
    # Non-migratable VMs pick up changes on their next explicit restart.
    workloadUpdateMethods:
      - LiveMigrate
