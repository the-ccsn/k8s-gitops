apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudreve
  namespace: prod
spec:
  parentRefs:
  - name: default-gateway
  hostnames:
  - cloud.ccsn.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cloudreve
      port: 5212
