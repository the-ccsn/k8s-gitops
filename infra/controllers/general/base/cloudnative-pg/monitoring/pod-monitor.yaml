apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg-clusters
  namespace: monitoring
  labels:
    application: cloudnative-pg
    component: database
spec:
  sampleLimit: 10000
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
      - key: cnpg.io/instanceRole
        operator: Exists
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        # Apply to every sample, including exporter health and backup metrics.
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster_name
      metricRelabelings:
        # The Pod label above is authoritative. Avoid a second, ambiguous key.
        - action: labeldrop
          regex: "server|cluster"
