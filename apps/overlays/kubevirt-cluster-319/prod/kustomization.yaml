---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
commonLabels:
  app.kubernetes.io/env: prod
resources:
  - ./external-services/
  - ./../../../base/grafana/
  - ./../../../base/oauth2-proxy/
  - ./../../../base/headlamp/
  - ./../../../base/seaweedfs-admin/
  - ./../../../base/flux-operator/
  - ./../../../base/vaultwarden/
  - ./../../../components/openlist/
  - ./../../../base/base/
  - ./../../../base/share/
  - ./../../../base/cloudreve/
  - ./resource-defaults.yaml
# Apply after commonLabels to preserve existing immutable workload selectors.
patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: external-s5624p-compat
    patch: |-
      - op: remove
        path: /spec/selector/matchLabels/app.kubernetes.io~1env
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: seaweedfs-admin
    patch: |-
      - op: remove
        path: /spec/selector/matchLabels/app.kubernetes.io~1env
  # Source Pods belong to monitoring/operator namespaces, not the prod overlay.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: cloudreve-dragonfly-metrics
    patch: |-
      - op: remove
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1env
      - op: remove
        path: /spec/ingress/0/from/1/podSelector/matchLabels/app.kubernetes.io~1env

components:
  - ../../../../observability/components/flux-event-tracing/
