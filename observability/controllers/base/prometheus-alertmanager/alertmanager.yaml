apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: platform
  namespace: monitoring
  labels:
    application: alertmanager
    component: runtime
spec:
  version: v0.32.1
  replicas: 1
  retention: 120h
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
  alertmanagerConfigSelector:
    matchLabels:
      observability.ccsn.dev/alertmanager: platform
  alertmanagerConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  alertmanagerConfigMatcherStrategy:
    type: None
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
