apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: central-notifications
  namespace: monitoring
  labels:
    application: alertmanager
    component: notifications
    observability.ccsn.dev/alertmanager: platform
spec:
  route:
    receiver: discard
    groupBy: [alertname, k8s_cluster_name, namespace, k8s_namespace_name, severity]
    groupWait: 1m
    groupInterval: 10m
    repeatInterval: 12h
    routes:
      - receiver: discard
        matchers:
          - name: severity
            matchType: "="
            value: info
      - receiver: telegram
        matchers:
          - name: severity
            matchType: "="
            value: critical
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
        continue: true
      - receiver: wecom
        matchers:
          - name: severity
            matchType: "="
            value: critical
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
      - receiver: telegram
        matchers:
          - name: alertname
            matchType: =~
            value: .+
        continue: true
      - receiver: wecom
        matchers:
          - name: alertname
            matchType: =~
            value: .+
  inhibitRules:
    # Escalation only suppresses the same alert on the same resource.
    - sourceMatch:
        - name: severity
          matchType: "="
          value: critical
      targetMatch:
        - name: severity
          matchType: "="
          value: warning
      equal: [alertname, k8s_cluster_name, namespace, node, pod, container, persistentvolumeclaim, exporter, instance, service_name, k8s_namespace_name, device, fstype, disk, volume, bucket, backup, cnpg_cluster_name]
    # Prefer the component-specific diagnostic over a generic scrape failure.
    - sourceMatch:
        - name: alertname
          matchType: =~
          value: AlertmanagerDown|OtelCollectorTargetDown|BlackboxExporterDown|HarborMetricsTargetDown|SeaweedFsMetricsDown|DragonflyMetricsDown
      targetMatch:
        - name: alertname
          matchType: "="
          value: ScrapeTargetDown
      equal: [k8s_cluster_name, job, instance]
  receivers:
    - name: discard
    - name: telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram
            key: bot-token
          chatID: -1001896823188
          # General (topic 1) is selected by omitting messageThreadID.
          httpConfig:
            proxyURL: http://proxy-svc.egress-system.svc.cluster.local:7890
          sendResolved: true
          parseMode: HTML
          message: |-
            {{ .Status | toUpper }} [{{ .CommonLabels.severity | html }}]: {{ printf "%.100s" .CommonLabels.alertname | html }}
            Cluster: {{ .CommonLabels.k8s_cluster_name | html }}
            Namespace: {{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace | html }}{{ else }}{{ .CommonLabels.k8s_namespace_name | html }}{{ end }}; alerts: {{ len .Alerts }}
            {{ range $i, $alert := .Alerts }}{{ if lt $i 5 }}
            - [{{ $alert.Status }}] {{ printf "%.120s" $alert.Annotations.summary | html }}
            {{ end }}{{ end }}
            {{ if gt (len .Alerts) 5 }}Only the first 5 alerts are shown; query Alertmanager for the full group.{{ end }}
    - name: wecom
      webhookConfigs:
        - urlSecret:
            name: alertmanager-wecom
            key: webhook-url
          httpConfig:
            proxyURL: http://proxy-svc.egress-system.svc.cluster.local:7890
          sendResolved: true
          timeout: 15s
          payload: |-
            {{ $state := "✅ 告警恢复" }}
            {{ if eq .Status "firing" }}{{ $state = "🔥 告警触发" }}{{ end }}
            {{ $namespace := .CommonLabels.namespace }}
            {{ if not $namespace }}{{ $namespace = .CommonLabels.k8s_namespace_name }}{{ end }}
            {{ $content := printf "%s [%s]\n**%.100s** (%d)\nCluster: %s\nNamespace: %s\n" $state .CommonLabels.severity .CommonLabels.alertname (len .Alerts) .CommonLabels.k8s_cluster_name $namespace }}
            {{ range $i, $alert := .Alerts }}{{ if lt $i 5 }}
            {{ $content = printf "%s\n> [%s] %.120s" $content $alert.Status $alert.Annotations.summary }}
            {{ end }}{{ end }}
            {{ if gt (len .Alerts) 5 }}
            {{ $content = printf "%s\n仅展示前 5 条，请在 Alertmanager 查询完整分组。" $content }}
            {{ end }}
            {"msgtype":"markdown","markdown":{"content":{{ $content | toJson }}}}
