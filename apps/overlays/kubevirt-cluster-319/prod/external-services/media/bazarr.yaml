apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-bazarr
spec:
  exportTo: ["."]
  hosts:
    - bazarr.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 6767
      name: http-bazarr
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-bazarr
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - bazarr.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: bazarr.external-services.mesh.internal
          port: 6767
