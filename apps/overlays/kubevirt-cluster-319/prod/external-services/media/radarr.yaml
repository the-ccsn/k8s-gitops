apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-radarr
spec:
  exportTo: ["."]
  hosts:
    - radarr.external-services.mesh.internal
  location: MESH_EXTERNAL
  ports:
    - number: 7878
      name: http-radarr
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: openmediavault.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-radarr
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - radarr.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: radarr.external-services.mesh.internal
          port: 7878
