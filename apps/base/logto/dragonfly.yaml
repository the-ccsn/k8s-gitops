---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: logto-dragonfly
  namespace: prod
spec:
  image: ghcr.io/the-ccsn/dragonfly:v1.40.1-auto-b204b3d41b2c@sha256:73ffbda489e1b16cf2378cad179bc612c1e99a22030d6b0eef0bd604fba9f862
  replicas: 1
  args:
    - --maxmemory=1600mb
    - --cache_mode=true
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 10Mi
  authentication:
    passwordFromSecret:
      name: logto-redis-auth
      key: REDIS_PASSWORD
---
# The Operator allows Redis traffic on 6379; ambient transports it over HBONE.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logto-dragonfly-ambient
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: logto-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 15008
