apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./service-monitor.yaml
  - ./metrics-authorization.yaml
  - ./rules.yaml
  - ./dashboard.yaml

configMapGenerator:
  - name: cert-manager-dashboard
    namespace: grafana
    files: [dashboard.json]
    options:
      # Grafana Operator watches this ConfigMap for dashboard content updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
