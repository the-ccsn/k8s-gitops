apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/i319-reroute/

patches:
  - target:
      kind: Certificate
      name: i319-reroute-tls
      namespace: i319-reroute
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: "*.kubevirt-cluster-319.319.ccsn.dev"

  - target:
      kind: Service
      name: i319-reroute
      namespace: i319-reroute
    patch: |-
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: "*.kubevirt-cluster-319.319.ccsn.dev,*.319.ccsn.dev,*.319.staging.ccsn.dev"

  - path: ./nginx-subconfig-infra-patch.yaml
    target:
      kind: ConfigMap
      name: i319-reroute-nginx-subconfig
      namespace: i319-reroute
