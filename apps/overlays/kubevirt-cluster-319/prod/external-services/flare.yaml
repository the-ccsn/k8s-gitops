apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: external-flare
spec:
  exportTo: ["."]
  hosts:
    - flare-direct.local
  location: MESH_EXTERNAL
  ports:
    - number: 80
      name: http-flare
      protocol: HTTP
  resolution: DNS
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-flare
spec:
  parentRefs:
    - name: default-gateway
  hostnames:
    - flare.ccsn.dev
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: flare-direct.local
          port: 80
