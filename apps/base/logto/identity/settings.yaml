apiVersion: configuration.logto.m.crossplane.io/v1alpha1
kind: SignInExperience
metadata:
  name: sign-in-experience
  namespace: prod
  annotations:
    crossplane.io/external-name: default
spec:
  managementPolicies:
  - Observe
  - Update
  forProvider:
    configuration: |-
      {
        "color": {
          "primaryColor": "#0057b8",
          "isDarkModeEnabled": true,
          "darkPrimaryColor": "#0057b8"
        },
        "branding": {
          "logoUrl": "https://login.ccsn.dev/branding/snc-ccsn-light.svg?v=a12269f8e663",
          "darkLogoUrl": "https://login.ccsn.dev/branding/snc-ccsn-dark.svg?v=83c090480247"
        },
        "hideLogtoBranding": false,
        "languageInfo": {
          "autoDetect": true,
          "fallbackLanguage": "en"
        },
        "termsOfUseUrl": null,
        "privacyPolicyUrl": null,
        "agreeToTermsPolicy": "Automatic",
        "signIn": {
          "methods": [
            {
              "identifier": "username",
              "password": true,
              "verificationCode": false,
              "isPasswordPrimary": true
            },
            {
              "identifier": "email",
              "password": true,
              "verificationCode": false,
              "isPasswordPrimary": true
            }
          ]
        },
        "signUp": {
          "identifiers": [
            "username"
          ],
          "password": true,
          "verify": true,
          "secondaryIdentifiers": [
            {
              "identifier": "email",
              "verify": true
            }
          ]
        },
        "socialSignIn": {
          "automaticAccountLinking": false,
          "skipRequiredIdentifiers": false
        },
        "socialSignInConnectorTargets": [
          "github"
        ],
        "signInMode": "SignInAndRegister",
        "customCss": ".logto_signature * {\n    display: none !important;\n}\n\n.logto_signature {\n    width: 0 !important;\n    height: 0 !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    border: none !important;\n    overflow: hidden !important;\n\n    pointer-events: none !important;\n    position: absolute !important;\n    top: -9999px !important;\n    left: -9999px !important;\n}\n\nbody {\n  /* Brand */\n  --color-brand-30: #00325C !important;\n  --color-brand-40: #004686 !important;\n  --color-brand-50: #0057B8 !important;\n  --color-brand-60: #8CBFFF !important;\n  --color-brand-70: #DCEBFF !important;\n\n  /* Neutral Variant */\n  --color-neutral-variant-60: #8F97A2 !important;\n  --color-neutral-variant-70: #ABB3BE !important;\n  --color-neutral-variant-80: #C7D0DA !important;\n  --color-neutral-variant-90: #E4EAF2 !important;\n}",
        "customContent": {},
        "customUiAssets": null,
        "customUiCsp": {},
        "passwordPolicy": {},
        "mfa": {
          "factors": [
            "Totp",
            "WebAuthn",
            "BackupCode",
            "EmailVerificationCode"
          ],
          "policy": "PromptAtSignInAndSignUpMandatory"
        },
        "adaptiveMfa": {
          "enabled": true
        },
        "singleSignOnEnabled": false,
        "supportEmail": null,
        "supportWebsiteUrl": null,
        "unknownSessionRedirectUrl": null,
        "captchaPolicy": {
          "enabled": true
        },
        "sentinelPolicy": {
          "maxAttempts": 30,
          "lockoutDuration": 60
        },
        "emailBlocklistPolicy": {},
        "forgotPasswordMethods": [
          "EmailVerificationCode"
        ],
        "passkeySignIn": {
          "enabled": true,
          "showPasskeyButton": true,
          "allowAutofill": true
        },
        "signUpProfileFields": null
      }
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
apiVersion: configuration.logto.m.crossplane.io/v1alpha1
kind: AccountCenter
metadata:
  name: account-center
  namespace: prod
  annotations:
    crossplane.io/external-name: default
spec:
  managementPolicies:
  - Observe
  - Update
  forProvider:
    configuration: |-
      {
        "enabled": true,
        "fields": {
          "name": "Edit",
          "avatar": "Edit",
          "profile": "Edit",
          "email": "Edit",
          "phone": "Off",
          "password": "Edit",
          "username": "Off",
          "social": "Edit",
          "customData": "Off",
          "mfa": "Edit",
          "session": "Edit"
        },
        "webauthnRelatedOrigins": [],
        "deleteAccountUrl": null,
        "customCss": ".logto_ac-signature * {\n    display: none !important;\n}\n\n.logto_ac-signature {\n    width: 0 !important;\n    height: 0 !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    border: none !important;\n    overflow: hidden !important;\n\n    pointer-events: none !important;\n    position: absolute !important;\n    top: -9999px !important;\n    left: -9999px !important;\n}\n\nbody {\n  /* Brand */\n  --color-brand-30: #00325C !important;\n  --color-brand-40: #004686 !important;\n  --color-brand-50: #0057B8 !important;\n  --color-brand-60: #8CBFFF !important;\n  --color-brand-70: #DCEBFF !important;\n\n  /* Neutral Variant */\n  --color-neutral-variant-60: #8F97A2 !important;\n  --color-neutral-variant-70: #ABB3BE !important;\n  --color-neutral-variant-80: #C7D0DA !important;\n  --color-neutral-variant-90: #E4EAF2 !important;\n}",
        "profileFields": null
      }
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
apiVersion: configuration.logto.m.crossplane.io/v1alpha1
kind: IDTokenConfiguration
metadata:
  name: id-token
  namespace: prod
  annotations:
    crossplane.io/external-name: default
spec:
  managementPolicies:
  - Observe
  - Update
  forProvider:
    configuration: |-
      {
        "enabledExtendedClaims": [
          "roles",
          "organizations",
          "organization_roles"
        ]
      }
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
---
apiVersion: configuration.logto.m.crossplane.io/v1alpha1
kind: OIDCSessionConfiguration
metadata:
  name: oidc-session
  namespace: prod
  annotations:
    crossplane.io/external-name: default
spec:
  managementPolicies:
  - Observe
  - Update
  forProvider:
    configuration: |-
      {
        "ttl": 1209600
      }
  providerConfigRef:
    name: ccsn-logto
    kind: ClusterProviderConfig
