  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/component: kube-controller-manager
      app.kubernetes.io/instance: victoriametrics
      app.kubernetes.io/name: vmks
