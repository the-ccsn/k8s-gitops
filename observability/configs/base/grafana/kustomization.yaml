apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ./grafana-folders.yaml
  - ./grafana-datasource-loki.yaml
  - ./grafana-datasource-tempo.yaml
  - ./availability-probe.yaml
  - ./kubernetes-dashboard.yaml
  - ./dashboard.yaml
  - ./pod-monitor.yaml

configMapGenerator:
  - name: grafana-dashboard
    namespace: grafana
    files:
      - dashboard.json
      - kubernetes-overview.json
    options:
      # Grafana Operator watches this ConfigMap for dashboard content updates.
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
