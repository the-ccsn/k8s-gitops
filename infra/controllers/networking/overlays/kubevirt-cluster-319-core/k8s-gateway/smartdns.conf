# Add these lines to the OpenWrt SmartDNS custom configuration.
# Keep existing default upstream servers for other domains.

# Resolve the upstream hostname independently of the split-DNS group.
server 1.1.1.1 -group k8s-bootstrap -exclude-default-group
server 8.8.8.8 -group k8s-bootstrap -exclude-default-group
nameserver /kubevirt-cluster-319.dns.internal.ccsn.dev/k8s-bootstrap

server kubevirt-cluster-319.dns.internal.ccsn.dev:53 -group k8s -exclude-default-group
nameserver /ccsn.dev/k8s
domain-rules /ccsn.dev/ -speed-check-mode none

# If dnsmasq forwards to SmartDNS with DNS rebind protection enabled,
# allow ccsn.dev under Network > DHCP and DNS > Rebind protection exceptions.
