apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: longhorn
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: storage
  json: |-
    {
      "title": "Longhorn",
      "uid": "longhorn",
      "tags": [
        "longhorn",
        "storage"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Volume Robustness",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "longhorn_volume_robustness == 1",
              "legendFormat": "{{volume}} {{state}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Volume Capacity Used",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "longhorn_volume_actual_size_bytes / clamp_min(longhorn_volume_capacity_bytes, 1) * 100",
              "legendFormat": "{{volume}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Node Storage Used",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "longhorn_node_storage_usage_bytes / clamp_min(longhorn_node_storage_capacity_bytes, 1) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Replica Count",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "count by (volume) (longhorn_replica_info)",
              "legendFormat": "{{volume}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
