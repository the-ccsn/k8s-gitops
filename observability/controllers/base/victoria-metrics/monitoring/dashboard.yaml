apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: victoriametrics
  namespace: grafana
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    observability.ccsn.dev/upstream-sha256: 13cc3979ae86be735a50d1fb45e6395aa8aad44bb19458fac9e8381c5a79cc84
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: database
  # Official v1.143.0 dashboard, pinned to the deployed application's commit.
  url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/5e9324673ed3baf83d13456a5af9bd3539ed456e/dashboards/victoriametrics.json
  datasources:
    # Bind braced datasource references; upstream's $ds variable refreshes on load.
    - inputName: ds
      datasourceName: victoriametrics
---
