apiVersion: v1
kind: Service
metadata:
  name: headlamp-metrics
  labels:
    app.kubernetes.io/name: headlamp-metrics
    # Label only this query boundary, never raw VMSingle or the proxy pods.
    headlamp-prometheus: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
