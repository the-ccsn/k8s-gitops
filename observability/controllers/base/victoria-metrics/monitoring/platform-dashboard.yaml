apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  name: observability-platform
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  json: |-
    {
      "title": "Observability Platform",
      "uid": "observability-platform",
      "tags": [
        "platform",
        "victoriametrics",
        "grafana"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Monitoring Targets Up",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"$namespace\",k8s_cluster_name=\"$k8s_cluster_name\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "title": "Samples Ingested",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(rate(vm_rows_inserted_total{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\",job=\"$vmsingle_job\"}[$__rate_interval]))",
              "legendFormat": "rows/s",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 3,
          "title": "VMSingle Data Size",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 15,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(vm_data_size_bytes{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\",job=\"$vmsingle_job\"})",
              "legendFormat": "data",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 4,
          "title": "vmagent Scrape Errors",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(rate(vm_promscrape_scrapes_failed_total{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\",job=\"$vmagent_job\"}[$__rate_interval])) by(job)",
              "legendFormat": "{{job}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 5,
          "title": "Remote Write Pending Data",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "targets": [
            {
              "expr": "sum(vmagent_remotewrite_pending_data_bytes{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\",job=\"$vmagent_job\"})",
              "legendFormat": "pending",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        }
      ],
      "description": "Project-specific summary of the installed metrics backends. Detailed component dashboards use pinned upstream sources.",
      "templating": {
        "list": [
          {
            "name": "k8s_cluster_name",
            "label": "Kubernetes cluster",
            "type": "query",
            "query": "label_values(vm_rows_inserted_total, k8s_cluster_name)",
            "definition": "label_values(vm_rows_inserted_total, k8s_cluster_name)",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {},
            "options": []
          },
          {
            "name": "namespace",
            "label": "Backend namespace",
            "type": "query",
            "query": "label_values(vm_rows_inserted_total{k8s_cluster_name=\"$k8s_cluster_name\"}, namespace)",
            "definition": "label_values(vm_rows_inserted_total{k8s_cluster_name=\"$k8s_cluster_name\"}, namespace)",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {},
            "options": []
          },
          {
            "name": "vmsingle_job",
            "label": "VMSingle job",
            "type": "query",
            "query": "label_values(vm_rows_inserted_total{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\"}, job)",
            "definition": "label_values(vm_rows_inserted_total{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\"}, job)",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {},
            "options": []
          },
          {
            "name": "vmagent_job",
            "label": "VMAgent job",
            "type": "query",
            "query": "label_values(vmagent_remotewrite_pending_data_bytes{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\"}, job)",
            "definition": "label_values(vmagent_remotewrite_pending_data_bytes{k8s_cluster_name=\"$k8s_cluster_name\",namespace=\"$namespace\"}, job)",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {},
            "options": []
          }
        ]
      },
      "id": null
    }
