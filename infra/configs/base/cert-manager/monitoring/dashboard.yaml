apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cert-manager
  namespace: grafana
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: platform
  json: |-
    {
      "title": "cert-manager",
      "uid": "cert-manager",
      "tags": [
        "cert-manager",
        "certificates"
      ],
      "description": "Controller metrics and managed certificate readiness/validity. Certificate namespaces use cert_manager_certificate_namespace_name; external TLS probes are available in the TLS Certificates dashboard.",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Controller Up",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "up{job=\"cert-manager\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Certificate Readiness",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "certmanager_certificate_ready_status{condition=\"True\"}",
              "legendFormat": "{{cert_manager_certificate_namespace_name}}/{{name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Certificate Validity",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(certmanager_certificate_not_after_timestamp_seconds - time()) / 86400",
              "legendFormat": "{{cert_manager_certificate_namespace_name}}/{{name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Controller Sync Errors",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (controller) (rate(certmanager_controller_sync_error_count[5m]))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
