apiVersion: batch/v1
kind: CronJob
metadata:
  name: proxy-engine-daily-restarter
  namespace: egress-system
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: proxy-engine-restarter-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restarter
            image: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
            command:
            - /bin/sh
            - -c
            - "kubectl rollout restart statefulset/proxy-engine -n egress-system && echo \"Triggered sing-box restart at $(date)\""
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
